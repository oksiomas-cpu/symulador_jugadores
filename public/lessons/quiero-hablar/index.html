<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Quiero Hablar</title>
<style>
  :root{
    --bg:#f6efe0;
    --paper:#fbf6ea;
    --paper-edge:#e9dfc4;
    --ink:#20392f;
    --ink-soft:#52685c;
    --accent:#7c2434;
    --accent-soft:#a6535f;
    --gold:#b3862e;
    --gold-soft:#e2cf9c;
    --glass-a:#dcece2;
    --glass-b:#f1f7f1;
    --btn:#fcf7ea;
    --font-display:'Playfair Display', 'Iowan Old Style', Georgia, serif;
    --font-body:'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  }

  * { box-sizing:border-box; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    padding-inline:16px;
    padding-block:14px;
  }

  a{color:inherit;}

  .wrap{
    max-width:840px;
    margin-inline:auto;
  }

  .crumbs{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
    font-family:var(--font-display);
    color:var(--ink-soft);
    font-size:1rem;
    letter-spacing:0.02em;
    margin-bottom:6px;
  }
  .crumbs .back{color:var(--accent); font-weight:600;}
  .crumbs .sep{opacity:0.5;}

  .eyebrow-top{
    font-family:var(--font-display);
    text-transform:uppercase;
    letter-spacing:0.16em;
    color:var(--accent);
    font-size:0.78rem;
    margin-bottom:4px;
  }

  h1.title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(1.9rem, 4.6vw, 2.6rem);
    color:var(--ink);
    margin:0 0 18px 0;
    text-wrap:balance;
  }

  /* stepper */
  .stepper{
    display:flex;
    align-items:center;
    gap:0;
    margin-bottom:14px;
    overflow-x:auto;
    padding-bottom:6px;
  }
  .stepper .node{
    flex:none;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-display);
    font-size:0.95rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .2s, color .2s, transform .15s;
  }
  .stepper .node:hover{ transform:translateY(-1px); }
  .stepper .node.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--paper);
  }
  .stepper .line{
    flex:1 1 12px;
    min-width:8px;
    height:1px;
    background:var(--gold-soft);
  }

  .progress-label{
    text-align:center;
    font-family:var(--font-display);
    color:var(--ink-soft);
    font-size:0.95rem;
    letter-spacing:0.06em;
    margin-bottom:10px;
  }

  /* cards */
  .stage{
    display:flex;
    justify-content:center;
  }

  .card{
    position:relative;
    aspect-ratio:1/1;
    width:var(--card-size, min(94vw, 720px));
    height:var(--card-size, min(94vw, 720px));
    margin-inline:auto;
    border-radius:26px;
    border:2px solid var(--gold);
    box-shadow:0 0 0 7px var(--paper) inset, 0 14px 34px -18px rgba(32,57,47,0.55);
    background:var(--paper);
    padding:clamp(28px, 5vw, 48px);
    display:flex;
    flex-direction:column;
    overflow:auto;
  }
  .card .eyebrow{
    font-family:var(--font-display);
    text-transform:uppercase;
    letter-spacing:0.16em;
    color:var(--accent);
    font-size:clamp(0.82rem, 2vw, 1rem);
    text-align:center;
    margin-bottom:14px;
  }

  .card h2{
    font-family:var(--font-display);
    font-weight:600;
    text-align:center;
    color:var(--ink);
    font-size:clamp(1.6rem, 4.6vw, 2.3rem);
    margin:0 0 20px 0;
    text-wrap:balance;
  }

  .card .body-copy{
    font-family:var(--font-body);
    font-size:clamp(1.5rem, 3.6vw, 1.95rem);
    line-height:1.5;
    color:var(--ink);
    text-align:center;
  }

  .card .note{
    font-family:var(--font-body);
    font-style:italic;
    color:var(--ink-soft);
    font-size:clamp(1.05rem, 2.4vw, 1.25rem);
    text-align:center;
    margin-top:auto;
    padding-top:16px;
  }

  .scene-lines{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin:auto 0;
  }
  .scene-lines .es{ font-size:clamp(1.5rem, 3.8vw, 1.9rem); }
  .scene-lines .highlight{
    color:var(--accent);
    font-weight:600;
  }

  .glass{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    border-radius:18px;
    border:1.5px solid var(--gold-soft);
    background:linear-gradient(160deg, var(--glass-a), var(--glass-b));
    margin:auto 0;
    padding:26px;
    text-align:center;
  }
  .glass .icon{ font-size:3.2rem; }
  .glass .qcode{
    font-family:var(--font-display);
    letter-spacing:0.1em;
    color:var(--ink-soft);
    font-size:1.05rem;
  }

  .audio-player{
    width:100%;
    max-width:420px;
    margin-top:6px;
  }

  .phrase-big{
    font-family:var(--font-display);
    text-align:center;
    font-size:clamp(1.9rem, 5.6vw, 2.7rem);
    line-height:1.35;
    margin:auto 0;
  }
  .phrase-big .op{ color:var(--accent); }
  .phrase-big .ac{ color:var(--gold); }

  .historia{
    font-family:var(--font-body);
    font-size:clamp(1.15rem, 2.6vw, 1.5rem);
    line-height:1.7;
    text-align:left;
    margin:auto 0;
    overflow-y:auto;
  }
  .historia p{ margin:0 0 12px 0; }
  .hl-op{ color:var(--accent); font-weight:600; }
  .hl-prep{ color:#2f6f76; font-weight:600; }
  .hl-domicilio{ color:var(--gold); font-weight:600; }
  .hl-day{ color:#b35a2e; font-weight:600; }
  .hl-time{ color:#3a6ea5; font-weight:600; }
  .historia-legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px 16px;
    font-family:var(--font-body);
    font-style:italic;
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-top:14px;
  }
  .historia-legend span b{ font-style:normal; }
  .arrow-row{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-top:18px;
    font-family:var(--font-body);
    font-size:1.05rem;
    color:var(--ink-soft);
    letter-spacing:0.04em;
  }
  .arrow-row span{ display:flex; align-items:center; gap:6px; }

  .btn{
    font-family:var(--font-display);
    font-size:1.12rem;
    background:var(--btn);
    border:1.6px solid var(--gold);
    color:var(--ink);
    border-radius:999px;
    padding:13px 24px;
    cursor:pointer;
    transition:background .15s, color .15s, transform .1s;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn.done{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .btn.ghost{ border-color:var(--gold-soft); color:var(--ink-soft); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }

  .btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
    margin:auto 0;
  }

  .swap-out{
    text-align:center;
    font-family:var(--font-display);
    font-size:clamp(1.6rem, 4.6vw, 2.1rem);
    color:var(--ink);
    margin-bottom:20px;
    min-height:1.5em;
  }
  .swap-out b{ color:var(--accent); }

  .field{
    width:100%;
    font-family:var(--font-body);
    font-size:1.3rem;
    padding:13px 16px;
    border-radius:12px;
    border:1.6px solid var(--gold-soft);
    background:#fffdf6;
    color:var(--ink);
  }
  .field:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .stack-mid{
    display:flex;
    flex-direction:column;
    gap:18px;
    margin:auto 0;
    align-items:center;
    width:100%;
  }

  .prompt-es{
    font-family:var(--font-display);
    font-style:italic;
    font-size:clamp(1.3rem, 3.2vw, 1.6rem);
    color:var(--ink-soft);
    text-align:center;
  }

  .table-ref{
    width:100%;
    border-collapse:collapse;
    font-family:var(--font-body);
    font-size:clamp(1.05rem, 2.4vw, 1.25rem);
    margin-top:16px;
  }
  .table-ref td{
    border-top:1px solid var(--gold-soft);
    padding:8px 10px;
    text-align:center;
    color:var(--ink-soft);
  }
  .table-ref .lbl{
    text-align:center;
    font-family:var(--font-display);
    text-transform:uppercase;
    letter-spacing:0.1em;
    font-size:0.75rem;
    color:var(--accent);
    padding-top:16px;
    border-top:none;
  }

  .faces{
    display:flex;
    gap:14px;
    justify-content:center;
    margin-bottom:18px;
  }
  .faces .btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--paper);
  }

  .face-panel{
    text-align:center;
    font-family:var(--font-display);
    font-size:clamp(1.6rem, 4.4vw, 2.1rem);
    color:var(--ink);
    margin:auto 0;
  }
  .face-panel .ctx{
    display:block;
    font-family:var(--font-body);
    font-style:italic;
    font-size:clamp(1.05rem, 2.6vw, 1.25rem);
    color:var(--ink-soft);
    margin-top:10px;
  }

  .script{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:auto 0;
    width:100%;
  }
  .line{
    display:flex;
    gap:10px;
    align-items:baseline;
    padding:8px 12px;
    border-radius:12px;
    transition:background .2s, color .2s;
  }
  .line .who{
    font-family:var(--font-display);
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    flex:none;
    width:78px;
  }
  .line .txt{ font-family:var(--font-body); font-size:clamp(1.05rem, 2.4vw, 1.3rem); }
  .line.you{ background:rgba(124,36,52,0.09); }
  .line.you .who{ color:var(--accent); }
  .line.clerk{ background:transparent; }
  .swap-toggle{ text-align:center; margin-top:14px; }

  textarea.field{ resize:vertical; min-height:78px; font-family:var(--font-body); }

  .check-row{
    display:flex;
    align-items:center;
    gap:12px;
    justify-content:center;
    font-family:var(--font-body);
    font-size:1.25rem;
    margin:auto 0 14px;
  }
  .check-row input[type=checkbox]{
    width:24px; height:24px; accent-color:var(--accent);
  }

  .qa-list{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    margin:auto 0;
    overflow-y:auto;
  }
  .qa-item{
    display:flex;
    flex-direction:column;
    gap:6px;
    border-top:1px solid var(--gold-soft);
    padding-top:12px;
  }
  .qa-item:first-child{ border-top:none; padding-top:0; }
  .qa-q{
    font-family:var(--font-display);
    font-style:italic;
    color:var(--ink-soft);
    font-size:clamp(0.98rem, 2.2vw, 1.15rem);
  }
  .qa-a{
    font-family:var(--font-body);
    color:var(--accent);
    font-size:clamp(1.02rem, 2.3vw, 1.2rem);
  }
  .btn.small{
    font-size:0.85rem;
    padding:7px 14px;
    align-self:flex-start;
  }

  .self-check{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:auto 0;
    overflow-y:auto;
  }
  .self-check label{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-family:var(--font-body);
    font-size:clamp(0.98rem, 2vw, 1.14rem);
    line-height:1.35;
    text-align:left;
    color:var(--ink);
  }
  .self-check input[type=checkbox]{
    margin-top:3px;
    width:20px; height:20px;
    accent-color:var(--accent);
    flex:none;
  }
  .self-check textarea.field{ margin-top:4px; }

  .anchor-word{
    font-family:var(--font-display);
    font-size:clamp(2.2rem, 7vw, 3rem);
    text-align:center;
    color:var(--accent);
    margin:auto 0 14px;
  }

  /* schema (operator) card */
  .schema{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    margin:auto 0;
    width:100%;
  }
  .schema .op-word{
    font-family:var(--font-display);
    font-size:clamp(2.1rem, 6vw, 2.9rem);
    color:var(--accent);
    background:var(--btn);
    border:2px solid var(--accent);
    border-radius:20px;
    padding:10px 30px;
  }
  .schema .down-arrow{
    font-size:1.6rem;
    color:var(--gold);
  }
  .schema .inf-tag{
    font-family:var(--font-body);
    font-style:italic;
    color:var(--ink-soft);
    font-size:1.1rem;
  }
  .schema .groups{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(100px, 1fr));
    gap:12px;
    width:100%;
  }
  .schema .grp{
    min-width:0;
    border:1.5px solid var(--gold-soft);
    border-radius:14px;
    background:linear-gradient(160deg, var(--glass-a), var(--glass-b));
    padding:14px 8px;
    text-align:center;
  }
  .schema .grp .tag{
    font-family:var(--font-display);
    color:var(--gold);
    font-size:1.05rem;
    letter-spacing:0.08em;
    margin-bottom:8px;
  }
  .schema .grp .verbs{
    font-family:var(--font-body);
    font-size:1.15rem;
    color:var(--ink);
    line-height:1.5;
  }

  /* dialogue audio-by-role */
  .role-audio{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    margin-bottom:14px;
  }
  .role-audio .row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .role-audio .role-label{
    font-family:var(--font-display);
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    flex:none;
    width:78px;
  }
  .role-audio audio{
    flex:1;
    height:32px;
  }
  .audio-hint{
    font-family:var(--font-body);
    font-style:italic;
    color:var(--ink-soft);
    font-size:0.95rem;
    text-align:center;
    margin-bottom:10px;
  }

  /* nav */
  .nav{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:14px;
  }
  .nav .btn{ min-width:150px; text-align:center; }

  footer.credit{
    text-align:center;
    font-family:var(--font-body);
    font-style:italic;
    color:var(--ink-soft);
    font-size:0.95rem;
    margin-top:26px;
  }

  /* glossary */
  .glossary-fab{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:50;
    font-family:var(--font-display);
    font-size:1rem;
    background:var(--accent);
    color:var(--paper);
    border:none;
    border-radius:999px;
    padding:13px 22px;
    box-shadow:0 10px 24px -10px rgba(32,57,47,0.55);
    cursor:pointer;
    transition:transform .12s;
  }
  .glossary-fab:hover{ transform:translateY(-2px); }

  .glossary-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(20,20,19,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .glossary-overlay[hidden]{ display:none; }

  .glossary-panel{
    width:100%;
    max-width:560px;
    max-height:82vh;
    overflow-y:auto;
    background:var(--paper);
    border:2px solid var(--gold);
    border-radius:22px;
    padding:clamp(20px, 4vw, 34px);
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.5);
  }
  .glossary-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  .glossary-head h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(1.4rem, 4vw, 1.8rem);
    color:var(--ink);
    margin:0;
  }
  .glossary-progress{
    font-family:var(--font-body);
    color:var(--accent);
    font-size:0.92rem;
    margin-top:6px;
  }
  .glossary-close{
    font-family:var(--font-display);
    font-size:0.95rem;
    background:var(--btn);
    border:1.6px solid var(--gold);
    color:var(--ink);
    border-radius:999px;
    padding:8px 16px;
    cursor:pointer;
    flex:none;
  }
  .glossary-group{ margin-bottom:18px; }
  .glossary-group:last-child{ margin-bottom:0; }
  .glossary-group-title{
    font-family:var(--font-display);
    text-transform:uppercase;
    letter-spacing:0.12em;
    font-size:0.78rem;
    color:var(--accent);
    margin-bottom:8px;
  }
  .glossary-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 0;
    border-top:1px solid var(--gold-soft);
    transition:opacity .15s;
  }
  .glossary-group .glossary-item:first-of-type{ border-top:none; padding-top:0; }
  .glossary-check{
    flex:none;
    display:flex;
    align-items:center;
  }
  .glossary-checkbox{
    width:20px;
    height:20px;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .glossary-main{
    flex:1 1 auto;
    min-width:0;
  }
  .glossary-word{
    font-family:var(--font-display);
    font-size:1.12rem;
    color:var(--ink);
  }
  .glossary-transcription{
    font-family:var(--font-body);
    font-style:italic;
    color:var(--ink-soft);
    font-size:0.95rem;
  }
  .glossary-ru{
    flex:none;
    max-width:42%;
    font-family:var(--font-body);
    color:var(--ink-soft);
    font-size:1rem;
    text-align:right;
  }
  .glossary-item.is-own .glossary-word::after{ content:' · моё'; font-family:var(--font-body); font-style:italic; font-size:0.8rem; color:var(--accent); }
  .glossary-del{ flex:none; background:none; border:none; color:var(--ink-soft); font-size:1.1rem; cursor:pointer; padding:4px 6px; }
  .glossary-add-toggle{ margin-top:8px; font-family:var(--font-body); font-size:0.95rem; background:none; border:1.4px dashed var(--gold); color:var(--accent); border-radius:999px; padding:6px 14px; cursor:pointer; }
  .glossary-add-form{ margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; }
  .glossary-add-form[hidden]{ display:none; }
  .glossary-add-form input{ flex:1 1 140px; min-width:0; font-family:var(--font-body); font-size:16px; padding:9px 12px; border:1.4px solid var(--gold-soft); border-radius:12px; background:var(--paper); color:var(--ink); }
  .glossary-add-form input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .glossary-add-save{ flex:none; font-family:var(--font-display); font-size:0.95rem; background:var(--accent); color:var(--paper); border:none; border-radius:999px; padding:9px 18px; cursor:pointer; }
  .glossary-item.is-known{ opacity:0.48; }
  .glossary-item.is-known .glossary-word{ text-decoration:line-through; }
  /* grammar block 17+ */
  .op-list{ display:flex; flex-direction:column; gap:7px; width:100%; }
  .op-row{ display:grid; grid-template-columns:minmax(70px,auto) 1fr; gap:2px 14px; align-items:baseline; border:1.5px solid var(--gold-soft); border-radius:14px; background:linear-gradient(160deg, var(--glass-a), var(--glass-b)); padding:7px 14px; }
  .op-name{ grid-row:span 2; font-family:var(--font-display); color:var(--accent); font-size:1.25rem; }

  function makePhoto(asset, tile, square=false){
    const frame = document.createElement('div'); frame.className = 'tile-photo';
    frame.setAttribute('role','img');
    frame.setAttribute('aria-label','Светлая фотография из истории о покупке продуктов');
    const img = document.createElement('img'); img.alt = '';
    img.src = VISUAL_ASSETS[asset];
    img.dataset.asset = String(asset);
    img.dataset.grid = asset >= 2 ? '3' : '1';
    img.dataset.col = String(tile % 3); img.dataset.row = String(Math.floor(tile / 3));

    if(square) frame.classList.add('square-photo');
    return frame;

  function layoutPhotos(){
    document.querySelectorAll('.tile-photo').forEach(frame=>{
      const img=frame.querySelector('img'); if(!img) return;
      const w=frame.clientWidth, h=frame.clientHeight;

      const grid=Number(img.dataset.grid);
      if(grid===1){
        // Cover the frame while keeping the original scene's center.
            if(!img.naturalWidth || !img.naturalHeight) return;
        const scale=Math.max(w/img.naturalWidth,h/img.naturalHeight);
        const iw=img.naturalWidth*scale, ih=img.naturalHeight*scale;
        img.style.width=iw+'px'; img.style.height=ih+'px';
        img.style.left=((w-iw)/2)+'px';
        img.style.top=((h-ih)*(img.dataset.asset === '1' ? .27 : .67))+'px';
      } else {
        const cell=w;
        img.style.width=(grid*cell)+'px'; img.style.height=(grid*cell)+'px';
        img.style.left=(-Number(img.dataset.col)*cell)+'px';

  let current = 0;
  const cards = [];

  steps.forEach((s, i) => {
    const card = document.createElement('section');
    card.className = 'card';
    card.hidden = i !== 0;
    const eyebrow = document.createElement('div');
    eyebrow.className = 'eyebrow';
    eyebrow.textContent = s.eyebrow;

    h2.textContent = s.title;

    deck.appendChild(card);
    cards.push(card);

    const node = document.createElement('div');
    node.className = 'node' + (i === 0 ? ' active' : '');
    node.textContent = i + 1;
    node.addEventListener('click', () => showStep(i));
    stepperEl.appendChild(node);
    nodes.push(node);
    if (i < steps.length - 1) {
      const line = document.createElement('div');
      line.className = 'line';
      stepperEl.appendChild(line);
    }
  });

  function showStep(idx){
    idx = Math.max(0, Math.min(steps.length - 1, idx));
    cards.forEach((c, i) => c.hidden = i !== idx);
    nodes.forEach((n, i) => n.classList.toggle('active', i === idx));
    current = idx;
    progressLabel.textContent = 'Шаг ' + (idx + 1) + ' из ' + steps.length;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === steps.length - 1;
    window.scrollTo({top: 0, behavior: 'smooth'});
    requestAnimationFrame(() => { if (typeof layoutPhotos === 'function') layoutPhotos(); });
  }
  prevBtn.addEventListener('click', () => showStep(current - 1));
  nextBtn.addEventListener('click', () => showStep(current + 1));
  showStep(0);

  const wrapEl = document.querySelector('.wrap');

  function fitCard(){
    const others = Array.from(wrapEl.children).filter(el => el !== stageEl);
    let usedH = 0;
    others.forEach(el => { usedH += el.getBoundingClientRect().height; });
    const bodyStyle = getComputedStyle(document.body);
    const vPad = parseFloat(bodyStyle.paddingTop) + parseFloat(bodyStyle.paddingBottom);
    const availH = window.innerHeight - usedH - vPad - 24;
    const availW = window.innerWidth - 32;
    const size = Math.max(280, Math.min(availW, availH, 720));
    document.documentElement.style.setProperty('--card-size', size + 'px');
  }
  window.addEventListener('resize', fitCard);
  fitCard();

  // ---------- игры на повтор ----------
  const JG_MAX = {g1:6, g2:10, g3:9, g4:10, g5:5};
  const JG_KEY = 'ciudad_juegos_puntos_es';
  let jgBest = {};
  try { jgBest = JSON.parse(localStorage.getItem(JG_KEY) || '{}') || {}; } catch(e) {}
  const jgTotalMax = Object.values(JG_MAX).reduce((a,b)=>a+b,0);
  const jgBadge = document.createElement('div'); jgBadge.className = 'jg-badge';
  document.body.appendChild(jgBadge);
  function jgUpdateBadge(){ const t = Object.values(jgBest).reduce((a,b)=>a+(b||0),0); jgBadge.textContent = '⭐ ' + t + ' из ' + jgTotalMax; }
  jgUpdateBadge();
  function jgResult(id, raw, errors){
    const pts = Math.max(0, raw - errors);
    const prev = jgBest[id] || 0;
    if (pts > prev) { jgBest[id] = pts; try { localStorage.setItem(JG_KEY, JSON.stringify(jgBest)); } catch(e) {} jgUpdateBadge(); }
    const best = Math.max(pts, prev);
    return `+${pts} ${pts===1?'балл':(pts>=2&&pts<=4?'балла':'баллов')} из ${JG_MAX[id]}` + (prev && pts <= prev ? ` · лучший: ${best}` : '');
  }
  function jgLive(st, raw, errors){ return ' · ⭐ ' + Math.max(0, raw - errors); }
  function jgShuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  function jgWin(errors, total, unit){
    return errors===0 ? `¡Perfecto! ${total} из ${total} без ошибок` : `¡Bien! ${total} из ${total} · ошибок: ${errors}`;
  }
  function jgFrame(card, lead){
    const l=document.createElement('div'); l.className='jg-lead'; l.textContent=lead; card.appendChild(l);
    const box=document.createElement('div'); box.style.width='100%'; box.style.margin='auto 0'; card.appendChild(box);
    const st=document.createElement('div'); st.className='jg-status'; card.appendChild(st);
    return {box, st};
  }
  function jgAgain(card, fn){
    const b=document.createElement('button'); b.className='btn small ghost jg-again'; b.textContent='Ещё раз';
    b.addEventListener('click', fn); return b;
  }

  // Juego 1 — пары: глагол ↔ перевод
  function renderJuego1(card){
    const pairs=[['hablar','говорить'],['estudiar','изучать'],['aprender','учиться, узнавать'],['entender','понимать'],['vivir','жить'],['conducir','водить машину']];
    const {box, st}=jgFrame(card,'Нажми испанский глагол, потом его перевод. Пара — 1 балл, ошибка — минус 1.');
    function start(){
      box.innerHTML=''; st.innerHTML='';
      let sel=null, done=0, errors=0;
      const grid=document.createElement('div'); grid.className='jg-pairs';
      const L=document.createElement('div'); L.className='jg-col';
      const R=document.createElement('div'); R.className='jg-col';
      jgShuffle(pairs).forEach(p=>{ const c=document.createElement('button'); c.type='button'; c.className='jg-chip'; c.textContent=p[0]; c.dataset.k=p[0]; c.dataset.side='es'; L.appendChild(c); });
      jgShuffle(pairs).forEach(p=>{ const c=document.createElement('button'); c.type='button'; c.className='jg-chip'; c.textContent=p[1]; c.dataset.k=p[0]; c.dataset.side='ru'; R.appendChild(c); });
      grid.append(L,R); box.appendChild(grid);
      st.textContent='Пар: 0 из '+pairs.length;
      grid.addEventListener('click', e=>{
        const c=e.target.closest('.jg-chip'); if(!c || c.classList.contains('ok')) return;
        if(!sel || sel.dataset.side===c.dataset.side){ if(sel) sel.classList.remove('sel'); sel=c; c.classList.add('sel'); return; }
        if(sel.dataset.k===c.dataset.k){
          sel.classList.remove('sel'); sel.classList.add('ok'); c.classList.add('ok'); sel=null; done++;
          st.textContent='Пар: '+done+' из '+pairs.length+jgLive(st,done,errors);
          if(done===pairs.length){ st.innerHTML=''; const w=document.createElement('div'); w.className='jg-win'; w.textContent=jgWin(errors,pairs.length); const pt=document.createElement('div'); pt.className='jg-pts'; pt.textContent=jgResult('g1', pairs.length*1, errors); st.append(w,pt); st.appendChild(jgAgain(card,start)); }
        } else {
          errors++; c.classList.add('bad'); setTimeout(()=>c.classList.remove('bad'),400);
        }
      });
    }
    start();
  }

  // движок «вставь слово»
  function jgFill(card, lead, items, id, per){
    const {box, st}=jgFrame(card, lead);
    function start(){
      box.innerHTML=''; st.innerHTML='';
      let k=0, errors=0; const order=jgShuffle(items);
      const q=document.createElement('div'); q.className='jg-q';
      const opts=document.createElement('div'); opts.className='jg-opts';
      box.append(q,opts);
      function show(){
        const it=order[k]; const parts=it.s.split('___');
        q.innerHTML=''; q.append(parts[0]); const g=document.createElement('span'); g.className='gap'; g.textContent='\u00a0'; q.append(g, parts[1]||'');
        opts.innerHTML='';
        jgShuffle(it.o).forEach(o=>{
          const b=document.createElement('button'); b.type='button'; b.className='jg-chip'; b.textContent=o;
          b.addEventListener('click',()=>{
            if(o===it.o[0]){
              g.textContent=o; b.classList.add('ok'); opts.querySelectorAll('.jg-chip').forEach(x=>x.disabled=true);
              setTimeout(()=>{ k++; if(k<order.length){ st.textContent='Фраза '+(k+1)+' из '+order.length+jgLive(st,k*per,errors); show(); } else finish(); },700);
            } else { errors++; b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),400); }
          });
          opts.appendChild(b);
        });
      }
      function finish(){ opts.innerHTML=''; st.innerHTML=''; const w=document.createElement('div'); w.className='jg-win'; w.textContent=jgWin(errors,order.length); const pt=document.createElement('div'); pt.className='jg-pts'; pt.textContent=jgResult(id, order.length*per, errors); st.append(w,pt); st.appendChild(jgAgain(card,start)); }
      st.textContent='Фраза 1 из '+order.length; show();
    }
    start();
  }

  // Juego 2 — слова звонка (первый вариант в o — правильный)
  function renderJuego2(card){
    jgFill(card,'Выбери слово, которое закрывает фразу.',[
      {s:'Buenos ___.', o:['días','gracias','favor']},
      {s:'Quisiera pedir la compra, por ___.', o:['favor','días','todo']},
      {s:'Necesito pan, leche y ___.', o:['huevos','tienda','domicilio']},
      {s:'¿Algo ___?', o:['más','todo','claro']},
      {s:'No, eso es ___. Gracias.', o:['todo','más','algo']},
    ], 'g2', 2);
  }

  // движок «собери по порядку»
  function jgOrder(card, lead, tasks, vertical, id, per){
    const {box, st}=jgFrame(card, lead);
    function start(){
      box.innerHTML=''; st.innerHTML='';
      let t=0, errors=0; const list=vertical ? tasks : jgShuffle(tasks);
      const built=document.createElement('div'); built.className='jg-built'+(vertical?' col':'');
      const pool=document.createElement('div'); pool.className='jg-pool'+(vertical?' col':'');
      box.append(built,pool);
      function show(){
        const parts=list[t]; let pos=0;
        built.innerHTML=''; pool.innerHTML='';
        jgShuffle(parts.map((p,i)=>[p,i])).forEach(([p,i])=>{
          const b=document.createElement('button'); b.type='button'; b.className='jg-chip'; b.textContent=p;
          b.addEventListener('click',()=>{
            if(b.classList.contains('used')) return;
            if(p===parts[pos]){
              b.classList.add('used'); b.disabled=true;
              const s=document.createElement('span'); s.textContent=p;
              if(vertical){ s.className='ln '+(pos%2===0?'q':'a'); }
              built.appendChild(s); pos++;
              if(pos===parts.length){
                setTimeout(()=>{ t++; if(t<list.length){ st.textContent=(vertical?'Разговор ':'Фраза ')+(t+1)+' из '+list.length+jgLive(st,t*per,errors); show(); } else finish(); }, vertical?1600:900);
              }
            } else { errors++; b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),400); }
          });
          pool.appendChild(b);
        });
      }
      function finish(){ pool.innerHTML=''; st.innerHTML=''; const w=document.createElement('div'); w.className='jg-win'; w.textContent=vertical ? (errors===0 ? '¡Perfecto! Разговор собран без ошибок' : '¡Bien! Разговор собран · ошибок: '+errors) : jgWin(errors,list.length); const pt=document.createElement('div'); pt.className='jg-pts'; pt.textContent=jgResult(id, list.length*per, errors); st.append(w,pt); st.appendChild(jgAgain(card,start)); }
      st.textContent=list.length>1 ? (vertical?'Разговор 1 из ':'Фраза 1 из ')+list.length : ''; show();
    }
    start();
  }

  // Juego 3 — фраза по формуле, время первым
  function renderJuego3(card){
    jgOrder(card,'Собери фразу по формуле: время — всегда первым.',[
      ['Hoy','no puedo','salir de','casa.'],
      ['Mañana','voy a','llamar a','la tienda.'],
      ['Por la mañana','quiero','ayudar a','mi familia.'],
    ], false, 'g3', 3);
  }

  // Juego 4 — связи и операторы
  function renderJuego4(card){
    jgFill(card,'Какое слово держит эту связь?',[
      {s:'Vivo ___ España.', o:['en','a','de']},
      {s:'Quiero ayudar ___ mi familia.', o:['a','en','de']},
      {s:'Hoy no puedo salir ___ casa.', o:['de','en','a']},
      {s:'Mañana ___ a llamar a la tienda.', o:['voy','quiero','puedo']},
      {s:'¿A qué hora? — ___ las diez.', o:['A','En','De']},
    ], 'g4', 2);
  }

  // Juego 5 — собери разговор из перепутанных реплик
  function renderJuego5(card){
    jgOrder(card,'Реплики перепутались. Нажимай по порядку: вопрос — ответ — вопрос.',[
      ['¿Qué quieres hacer?','Hoy quiero pedir la compra a domicilio.','¿Por qué quieres pedir la compra?','Porque hoy no puedo salir de casa.','¿Por qué no puedes salir?','Porque por la mañana voy a estudiar español.'],
    ], true, 'g5', 5);
  }

  let origCounter = -1;
  steps.forEach((st,i)=>{
    const card=cards[i];
    if(st.review){ card.dataset.index='r'; card.dataset.density='dense'; card.classList.add('is-review'); }
    else { origCounter++; }
    const oi = st.review ? -1 : origCounter;
    if(!st.review) card.dataset.index=String(oi);
    if(DENSE.has(oi)) card.dataset.density='dense';
    const mark=document.createElement('div'); mark.className='series-mark';
    mark.textContent='LA CIUDAD DE LOS SENTIDOS';
    card.insertBefore(mark,card.firstChild);
    if(oi>=0 && VISUALS[oi]){
      const [asset,tile]=VISUALS[oi];
      card.querySelector('h2').insertAdjacentElement('afterend',makePhoto(asset,tile));
    }
  });
  window.addEventListener('resize',layoutPhotos);
  document.querySelectorAll('.tile-photo img').forEach(img=>img.addEventListener('load',layoutPhotos));
  requestAnimationFrame(layoutPhotos);

  // пустые аудиоисточники не показывают плеер (версия файла без аудио)
  document.querySelectorAll('#deck audio').forEach(a => {
    if (a.getAttribute('src')) return;
    const row = a.closest('.role-audio .row');
    const glass = a.closest('.glass');
    if (row) row.hidden = true;
    else if (glass) glass.hidden = true;
    else a.hidden = true;
  });
  document.querySelectorAll('#deck .role-audio').forEach(w => {
    if (w.querySelectorAll('.row:not([hidden])').length === 0) {
      w.hidden = true;
      const hint = w.nextElementSibling;
      if (hint && hint.classList.contains('audio-hint')) hint.hidden = true;
    }
  });
  fitCard();

  // --- словарь материала: плавающая кнопка, доступна на любом шаге ---
  const GLOSSARY = [
    {
      group: 'Операторы',
      items: [
        {w:'querer', tr:'керэ́р', ru:'хотеть (словарная форма)'},
        {w:'quiero', tr:'кье́ро', ru:'я хочу'},
        {w:'quisiera', tr:'кисье́ра', ru:'я хотел(а) бы — вежливо'},
        {w:'quería', tr:'кери́а', ru:'я хотел(а) бы — мягче, разговорно'},
        {w:'no puedo', tr:'но пуэ́до', ru:'я не могу'},
        {w:'voy a', tr:'вой а', ru:'я собираюсь / иду'},
        {w:'¿quiere?', tr:'кье́рэ', ru:'хотите — так спрашивают вежливо'},
      ]
    },
    {
      group: 'Глаголы в инфинитиве',
      items: [
        {w:'hablar', tr:'абла́р', ru:'говорить'},
        {w:'estudiar', tr:'эстудья́р', ru:'учиться, изучать'},
        {w:'aprender', tr:'апрендэ́р', ru:'учиться, узнавать'},
        {w:'entender', tr:'энтендэ́р', ru:'понимать'},
        {w:'vivir', tr:'виви́р', ru:'жить'},
        {w:'conducir', tr:'кондуси́р', ru:'водить (машину)'},
        {w:'ayudar', tr:'аюда́р', ru:'помогать'},
        {w:'pedir', tr:'педи́р', ru:'заказывать, просить'},
        {w:'recibir', tr:'ресиби́р', ru:'получать'},
      ]
    },
    {
      group: 'Глагол + предлог (пара фиксирована)',
      items: [
        {w:'vivir en', tr:'виви́р эн', ru:'жить в (стране)'},
        {w:'ayudar a', tr:'аюда́р а', ru:'помогать (кому-то)'},
        {w:'salir de', tr:'сали́р дэ', ru:'выходить из'},
        {w:'llamar a', tr:'льяма́р а', ru:'звонить (кому-то)'},
      ]
    },
    {
      group: 'Слова материала',
      items: [
        {w:'la compra', tr:'ля ко́мпра', ru:'покупки, продукты'},
        {w:'a domicilio', tr:'а домиси́лио', ru:'на дом, с доставкой'},
        {w:'un pan', tr:'ун пан', ru:'хлеб'},
        {w:'la leche', tr:'ля ле́чэ', ru:'молоко'},
        {w:'unos huevos', tr:'у́нос уэ́вос', ru:'яйца'},
        {w:'la tienda', tr:'ля тье́нда', ru:'магазин'},
        {w:'mañana', tr:'манья́на', ru:'завтра / утро (два значения сразу)'},
        {w:'por la mañana', tr:'пор ля манья́на', ru:'утром'},
        {w:'por la tarde', tr:'пор ля та́рдэ', ru:'днём, после обеда'},
        {w:'a las diez', tr:'а лас дьес', ru:'в десять часов'},
        {w:'hoy', tr:'ой', ru:'сегодня'},
      ]
    },
    {
      group: 'Вежливые слова диалога',
      items: [
        {w:'buenos días', tr:'буэ́нос ди́ас', ru:'здравствуйте, добрый день'},
        {w:'gracias', tr:'гра́сьяс', ru:'спасибо'},
        {w:'por favor', tr:'пор фаво́р', ru:'пожалуйста'},
        {w:'¿diga?', tr:'ди́га', ru:'алло (при ответе на звонок)'},
        {w:'sí / no', tr:'си / но', ru:'да / нет'},
        {w:'claro', tr:'кла́ро', ru:'конечно'},
        {w:'sin problema', tr:'син пробле́ма', ru:'без проблем'},
        {w:'algo más', tr:'а́льго мас', ru:'что-то ещё'},
        {w:'eso es todo', tr:'э́со эс то́до', ru:'это всё'},
      ]
    },
    {
      group: 'Вопросы-ключи',
      items: [
        {w:'¿Cuándo?', tr:'куа́ндо', ru:'когда?'},
        {w:'¿A qué hora?', tr:'а ке о́ра', ru:'во сколько?'},
        {w:'¿Qué quieres hacer?', tr:'ке кье́рэс асэ́р', ru:'что ты хочешь сделать?'},
        {w:'¿Qué?', tr:'ке', ru:'что?'},
        {w:'¿Adónde?', tr:'адо́ндэ', ru:'куда?'},
        {w:'¿Dónde?', tr:'до́ндэ', ru:'где?'},
        {w:'¿Por qué? → porque', tr:'пор ке → по́ркэ', ru:'почему? → потому что'},
        {w:'¿Para qué? → para', tr:'па́ра ке → па́ра', ru:'зачем? → чтобы'},
        {w:'¿Cómo?', tr:'ко́мо', ru:'как?'},
        {w:'¿Y tú?', tr:'и ту', ru:'а ты?'},
      ]
    },
  ];

  const GLOSSARY_STORAGE_KEY = 'ciudad_glossary_known_es';
  let knownWords = {};
  try {
    const raw = localStorage.getItem(GLOSSARY_STORAGE_KEY);
    if (raw) knownWords = JSON.parse(raw) || {};
  } catch (e) {}

  function saveKnownWords(){
    try { localStorage.setItem(GLOSSARY_STORAGE_KEY, JSON.stringify(knownWords)); } catch (e) {}
  }

  const OWN_STORAGE_KEY = 'ciudad_glossary_own_es';
  let ownWords = {};
  try {
    const raw = localStorage.getItem(OWN_STORAGE_KEY);
    if (raw) ownWords = JSON.parse(raw) || {};
  } catch (e) {}
  function saveOwnWords(){
    try { localStorage.setItem(OWN_STORAGE_KEY, JSON.stringify(ownWords)); } catch (e) {}
  }

  function updateGlossaryProgress(){
    let total = GLOSSARY.reduce((sum, g) => sum + g.items.length, 0);
    let known = GLOSSARY.reduce((sum, g, gi) => sum + g.items.filter((_, ii) => knownWords[gi + '-' + ii]).length, 0);
    Object.values(ownWords).forEach(list => (list || []).forEach(o => { total++; if (o.k) known++; }));
    const el = document.getElementById('glossaryProgress');
    if (el) el.textContent = `Знаю: ${known} из ${total}`;
  }

  function makeItem(word, tr, ru, checked, opts){
    const item = document.createElement('div');
    item.className = 'glossary-item' + (checked ? ' is-known' : '') + (opts.own ? ' is-own' : '');
    const lab = document.createElement('label'); lab.className = 'glossary-check';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'glossary-checkbox';
    cb.checked = checked; cb.setAttribute('aria-label', 'Знаю это слово');
    Object.entries(opts.data).forEach(([k, v]) => cb.dataset[k] = v);
    lab.appendChild(cb);
    const main = document.createElement('div'); main.className = 'glossary-main';
    const w = document.createElement('div'); w.className = 'glossary-word'; w.textContent = word; main.appendChild(w);
    if (tr) { const t = document.createElement('div'); t.className = 'glossary-transcription'; t.textContent = '[' + tr + ']'; main.appendChild(t); }
    const r = document.createElement('div'); r.className = 'glossary-ru'; r.textContent = ru;
    item.append(lab, main, r);
    if (opts.own) {
      const del = document.createElement('button'); del.type = 'button'; del.className = 'glossary-del';
      del.textContent = '✕'; del.setAttribute('aria-label', 'Удалить моё слово');
      Object.entries(opts.data).forEach(([k, v]) => del.dataset[k] = v);
      item.appendChild(del);
    }
    return item;
  }

  function buildGlossary(){
    const body = document.getElementById('glossaryBody');
    body.innerHTML = '';
    GLOSSARY.forEach((g, gi) => {
      const groupEl = document.createElement('div');
      groupEl.className = 'glossary-group';
      const title = document.createElement('div');
      title.className = 'glossary-group-title';
      title.textContent = g.group;
      groupEl.appendChild(title);
      g.items.forEach((it, ii) => {
        const key = gi + '-' + ii;
        groupEl.appendChild(makeItem(it.w, it.tr, it.ru, !!knownWords[key], {own:false, data:{key}}));
      });
      (ownWords[gi] || []).forEach((o, oi) => {
        groupEl.appendChild(makeItem(o.w, '', o.ru, !!o.k, {own:true, data:{g:gi, o:oi}}));
      });
      const toggle = document.createElement('button');
      toggle.type = 'button'; toggle.className = 'glossary-add-toggle';
      toggle.textContent = '+ Моё слово';
      const form = document.createElement('div');
      form.className = 'glossary-add-form'; form.hidden = true;
      const inW = document.createElement('input'); inW.placeholder = 'по-испански'; inW.setAttribute('aria-label', 'Слово по-испански');
      const inR = document.createElement('input'); inR.placeholder = 'перевод'; inR.setAttribute('aria-label', 'Перевод');
      const save = document.createElement('button'); save.type = 'button'; save.className = 'glossary-add-save'; save.textContent = 'Добавить';
      form.append(inW, inR, save);
      toggle.addEventListener('click', () => { form.hidden = !form.hidden; if (!form.hidden) inW.focus(); });
      const add = () => {
        const w = inW.value.trim(); if (!w) { inW.focus(); return; }
        (ownWords[gi] = ownWords[gi] || []).push({w, ru: inR.value.trim(), k:false});
        saveOwnWords(); buildGlossary();
      };
      save.addEventListener('click', add);
      [inW, inR].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') add(); }));
      groupEl.append(toggle, form);
      body.appendChild(groupEl);
    });
    updateGlossaryProgress();
  }
  document.getElementById('glossaryBody').addEventListener('change', (e) => {
    const cb = e.target.closest('.glossary-checkbox');
    if (!cb) return;
    if (cb.dataset.key !== undefined) { knownWords[cb.dataset.key] = cb.checked; saveKnownWords(); }
    else { const o = (ownWords[cb.dataset.g] || [])[cb.dataset.o]; if (o) { o.k = cb.checked; saveOwnWords(); } }
    cb.closest('.glossary-item').classList.toggle('is-known', cb.checked);
    updateGlossaryProgress();
  });
  document.getElementById('glossaryBody').addEventListener('click', (e) => {
    const del = e.target.closest('.glossary-del');
    if (!del) return;
    const list = ownWords[del.dataset.g] || [];
    list.splice(+del.dataset.o, 1);
    saveOwnWords(); buildGlossary();
  });
  buildGlossary();

  const glossaryFab = document.getElementById('glossaryFab');
  const glossaryOverlay = document.getElementById('glossaryOverlay');
  const glossaryClose = document.getElementById('glossaryClose');
  glossaryFab.addEventListener('click', () => { glossaryOverlay.hidden = false; });
  glossaryClose.addEventListener('click', () => { glossaryOverlay.hidden = true; });
  glossaryOverlay.addEventListener('click', (e) => { if (e.target === glossaryOverlay) glossaryOverlay.hidden = true; });
})();
</script>
