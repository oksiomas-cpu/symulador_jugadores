<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Урок 2 · Puedo</title>
<style>
  :root{
    --bg:#f6efe0;
    --paper:#fbf6ea;
    --paper-edge:#e9dfc4;
    --ink:#20392f;
    --ink-soft:#52685c;
    --accent:#7c2434;
    --accent-soft:#a6535f;
    --gold:#b3862e;
    --gold-soft:#e2cf9c;
    --glass-a:#dcece2;
    --glass-b:#f1f7f1;
    --btn:#fcf7ea;
    --font-display:'Playfair Display', 'Iowan Old Style', Georgia, serif;
    --font-body:'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  }

  * { box-sizing:border-box; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    padding-inline:16px;
    padding-block:14px;
  }

  a{color:inherit;}

  .wrap{
    max-width:840px;
    margin-inline:auto;
  }

  .crumbs{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
    font-family:var(--font-display);
    color:var(--ink-soft);
    font-size:1rem;
    letter-spacing:0.02em;
    margin-bottom:6px;
  }
  .crumbs .back{color:var(--accent); font-weight:600;}
  .crumbs .sep{opacity:0.5;}

  .eyebrow-top{
    font-family:var(--font-display);
    text-transform:uppercase;
    letter-spacing:0.16em;
    color:var(--accent);
    font-size:0.78rem;
    margin-bottom:4px;
  }

  h1.title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(1.9rem, 4.6vw, 2.6rem);
    color:var(--ink);
    margin:0 0 18px 0;
    text-wrap:balance;
  }

  /* stepper */
  .stepper{
    display:flex;
    align-items:center;
    gap:0;
    margin-bottom:14px;
    overflow-x:auto;
    padding-bottom:6px;
  }
  .stepper .node{
    flex:none;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-display);
    font-size:0.95rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .2s, color .2s, transform .15s;
  }
  .stepper .node:hover{ transform:translateY(-1px); }
  .stepper .node.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--paper);
  }
  .stepper .line{
    flex:1 1 12px;
    min-width:8px;
    height:1px;
    background:var(--gold-soft);
  }

  .progress-label{
    text-align:center;
    font-family:var(--font-display);
    color:var(--ink-soft);
    font-size:0.95rem;
    letter-spacing:0.06em;
    margin-bottom:10px;
  }

  /* cards */
  .stage{
    display:flex;
    justify-content:center;
  }

  .card{
    position:relative;
    width:100%;
    height:100%;
    margin-inline:auto;
    border-radius:26px;
    border:2px solid var(--gold);
    box-shadow:0 0 0 7px var(--paper) inset, 0 14px 34px -18px rgba(32,57,47,0.55);
    background:var(--paper);
    padding:clamp(28px, 5vw, 48px);
    display:flex;
    flex-direction:column;
    overflow:auto;
  }
  .card .eyebrow{
    font-family:var(--font-display);
    text-transform:uppercase;
    letter-spacing:0.16em;
    color:var(--accent);
    font-size:clamp(0.82rem, 2vw, 1rem);
    text-align:center;
    margin-bottom:14px;
  }

  .card h2{
    font-family:var(--font-display);
    font-weight:600;
    text-align:center;
    color:var(--ink);
    font-size:clamp(1.6rem, 4.6vw, 2.3rem);
    margin:0 0 20px 0;
    text-wrap:balance;
  }

  .card .body-copy{
    font-family:var(--font-body);
    font-size:clamp(1.5rem, 3.6vw, 1.95rem);
    line-height:1.5;
    color:var(--ink);
    text-align:center;
  }

  .card .note{
    font-family:var(--font-body);
    font-style:italic;
    color:var(--ink-soft);
    font-size:clamp(1.05rem, 2.4vw, 1.25rem);
    text-align:center;
    margin-top:auto;
    padding-top:16px;
  }

  .scene-lines{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin:auto 0;
  }
  .scene-lines .es{ font-size:clamp(1.5rem, 3.8vw, 1.9rem); }
  .scene-lines .highlight{
    color:var(--accent);
    font-weight:600;
  }

  .glass{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    border-radius:18px;
    border:1.5px solid var(--gold-soft);
    background:linear-gradient(160deg, var(--glass-a), var(--glass-b));
    margin:auto 0;
    padding:26px;
    text-align:center;
  }
  .glass .icon{ font-size:3.2rem; }
  .glass .qcode{
    font-family:var(--font-display);
    letter-spacing:0.1em;
    color:var(--ink-soft);
    font-size:1.05rem;
  }

  .audio-player{
    width:100%;
    max-width:420px;
    margin-top:6px;
  }

  .phrase-big{
    font-family:var(--font-display);
    text-align:center;
    font-size:clamp(1.9rem, 5.6vw, 2.7rem);
    line-height:1.35;
    margin:auto 0;
  }
  .phrase-big .op{ color:var(--accent); }
  .phrase-big .ac{ color:var(--gold); }

  .historia{
    font-family:var(--font-body);
    font-size:clamp(1.15rem, 2.6vw, 1.5rem);
    line-height:1.7;
    text-align:left;
    margin:auto 0;
    overflow-y:auto;
  }
  .historia p{ margin:0 0 12px 0; }
  .hl-op{ color:var(--accent); font-weight:600; }
  .hl-prep{ color:#2f6f76; font-weight:600; }
  .hl-domicilio{ color:var(--gold); font-weight:600; }
  .hl-day{ color:#b35a2e; font-weight:600; }
  .hl-time{ color:#3a6ea5; font-weight:600; }
  .historia-legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px 16px;
    font-family:var(--font-body);
    font-style:italic;
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-top:14px;
  }
  .historia-legend span b{ font-style:normal; }
  .arrow-row{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-top:18px;
    font-family:var(--font-body);
    font-size:1.05rem;
    color:var(--ink-soft);
    letter-spacing:0.04em;
  }
  .arrow-row span{ display:flex; align-items:center; gap:6px; }

  .btn{
    font-family:var(--font-display);
    font-size:1.12rem;
    background:var(--btn);
    border:1.6px solid var(--gold);
    color:var(--ink);
    border-radius:999px;
    padding:13px 24px;
    cursor:pointer;
    transition:background .15s, color .15s, transform .1s;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn.done{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .btn.ghost{ border-color:var(--gold-soft); color:var(--ink-soft); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }

  .btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
    margin:auto 0;
  }

  .swap-out{
    text-align:center;
    font-family:var(--font-display);
    font-size:clamp(1.6rem, 4.6vw, 2.1rem);
    color:var(--ink);
    margin-bottom:20px;
    min-height:1.5em;
  }
  .swap-out b{ color:var(--accent); }

  .field{
    width:100%;
    font-family:var(--font-body);
    font-size:1.3rem;
    padding:13px 16px;
    border-radius:12px;
    border:1.6px solid var(--gold-soft);
    background:#fffdf6;
    color:var(--ink);
  }
  .field:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .stack-mid{
    display:flex;
    flex-direction:column;
    gap:18px;
    margin:auto 0;
    align-items:center;
    width:100%;
  }

  .prompt-es{
    font-family:var(--font-display);
    font-style:italic;
    font-size:clamp(1.3rem, 3.2vw, 1.6rem);
    color:var(--ink-soft);
    text-align:center;
  }

  .table-ref{
    width:100%;
    border-collapse:collapse;
    font-family:var(--font-body);
    font-size:clamp(1.05rem, 2.4vw, 1.25rem);
    margin-top:16px;
  }
  .table-ref td{
    border-top:1px solid var(--gold-soft);
    padding:8px 10px;
    text-align:center;
    color:var(--ink-soft);
  }
  .table-ref .lbl{
    text-align:center;
    font-family:var(--font-display);
    text-transform:uppercase;
    letter-spacing:0.1em;
    font-size:0.75rem;
    color:var(--accent);
    padding-top:16px;
    border-top:none;
  }

  .faces{
    display:flex;
    gap:14px;
    justify-content:center;
    margin-bottom:18px;
  }
  .faces .btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--paper);
  }

  .face-panel{
    text-align:center;
    font-family:var(--font-display);
    font-size:clamp(1.6rem, 4.4vw, 2.1rem);
    color:var(--ink);
    margin:auto 0;
  }
  .face-panel .ctx{
    display:block;
    font-family:var(--font-body);
    font-style:italic;
    font-size:clamp(1.05rem, 2.6vw, 1.25rem);
    color:var(--ink-soft);
    margin-top:10px;
  }

  .script{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:auto 0;
    width:100%;
  }
  .line{
    display:flex;
    gap:10px;
    align-items:baseline;
    padding:8px 12px;
    border-radius:12px;
    transition:background .2s, color .2s;
  }
  .line .who{
    font-family:var(--font-display);
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    flex:none;
    width:78px;
  }
  .line .txt{ font-family:var(--font-body); font-size:clamp(1.05rem, 2.4vw, 1.3rem); }
  .line.you{ background:rgba(124,36,52,0.09); }
  .line.you .who{ color:var(--accent); }
  .line.clerk{ background:transparent; }
  .swap-toggle{ text-align:center; margin-top:14px; }

  textarea.field{ resize:vertical; min-height:78px; font-family:var(--font-body); }

  .check-row{
    display:flex;
    align-items:center;
    gap:12px;
    justify-content:center;
    font-family:var(--font-body);
    font-size:1.25rem;
    margin:auto 0 14px;
  }
  .check-row input[type=checkbox]{
    width:24px; height:24px; accent-color:var(--accent);
  }

  .qa-list{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    margin:auto 0;
    overflow-y:auto;
  }
  .qa-item{
    display:flex;
    flex-direction:column;
    gap:6px;
    border-top:1px solid var(--gold-soft);
    padding-top:12px;
  }
  .qa-item:first-child{ border-top:none; padding-top:0; }
  .qa-q{
    font-family:var(--font-display);
    font-style:italic;
    color:var(--ink-soft);
    font-size:clamp(0.98rem, 2.2vw, 1.15rem);
  }
  .qa-a{
    font-family:var(--font-body);
    color:var(--accent);
    font-size:clamp(1.02rem, 2.3vw, 1.2rem);
  }
  .btn.small{
    font-size:0.85rem;
    padding:7px 14px;
    align-self:flex-start;
  }

  .self-check{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:auto 0;
    overflow-y:auto;
  }
  .self-check label{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-family:var(--font-body);
    font-size:clamp(0.98rem, 2vw, 1.14rem);
    line-height:1.35;
    text-align:left;
    color:var(--ink);
  }
  .self-check input[type=checkbox]{
    margin-top:3px;
    width:20px; height:20px;
    accent-color:var(--accent);
    flex:none;
  }
  .self-check textarea.field{ margin-top:4px; }

  .anchor-word{
    font-family:var(--font-display);
    font-size:clamp(2.2rem, 7vw, 3rem);
    text-align:center;
    color:var(--accent);
    margin:auto 0 14px;
  }

  /* schema (operator) card */
  .schema{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    margin:auto 0;
    width:100%;
  }
  .schema .op-word{
    font-family:var(--font-display);
    font-size:clamp(2.1rem, 6vw, 2.9rem);
    color:var(--accent);
    background:var(--btn);
    border:2px solid var(--accent);
    border-radius:20px;
    padding:10px 30px;
  }
  .schema .down-arrow{
    font-size:1.6rem;
    color:var(--gold);
  }
  .schema .inf-tag{
    font-family:var(--font-body);
    font-style:italic;
    color:var(--ink-soft);
    font-size:1.1rem;
  }
  .schema .groups{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(100px, 1fr));
    gap:12px;
    width:100%;
  }
  .schema .grp{
    min-width:0;
    border:1.5px solid var(--gold-soft);
    border-radius:14px;
    background:linear-gradient(160deg, var(--glass-a), var(--glass-b));
    padding:14px 8px;
    text-align:center;
  }
  .schema .grp .tag{
    font-family:var(--font-display);
    color:var(--gold);
    font-size:1.05rem;
    letter-spacing:0.08em;
    margin-bottom:8px;
  }
  .schema .grp .verbs{
    font-family:var(--font-body);
    font-size:1.15rem;
    color:var(--ink);
    line-height:1.5;
  }

  /* dialogue audio-by-role */
  .role-audio{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    margin-bottom:14px;
  }
  .role-audio .row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .role-audio .role-label{
    font-family:var(--font-display);
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    flex:none;
    width:78px;
  }
  .role-audio audio{
    flex:1 1 auto;
    min-width:0;
    max-width:calc(100% - 88px);
    height:32px;
  }
  .audio-hint{
    font-family:var(--font-body);
    font-style:italic;
    color:var(--ink-soft);
    font-size:0.95rem;
    text-align:center;
    margin-bottom:10px;
  }

  /* nav */
  .nav{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:14px;
  }
  .nav .btn{ min-width:150px; text-align:center; }

  footer.credit{
    text-align:center;
    font-family:var(--font-body);
    font-style:italic;
    color:var(--ink-soft);
    font-size:0.95rem;
    margin-top:26px;
  }

  /* glossary */
  .glossary-fab{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:50;
    font-family:var(--font-display);
    font-size:1rem;
    background:var(--accent);
    color:var(--paper);
    border:none;
    border-radius:999px;
    padding:13px 22px;
    box-shadow:0 10px 24px -10px rgba(32,57,47,0.55);
    cursor:pointer;
    transition:transform .12s;
  }
  .glossary-fab:hover{ transform:translateY(-2px); }

  .glossary-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(20,20,19,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .glossary-overlay[hidden]{ display:none; }

  .glossary-panel{
    width:100%;
    max-width:560px;
    max-height:82vh;
    overflow-y:auto;
    background:var(--paper);
    border:2px solid var(--gold);
    border-radius:22px;
    padding:clamp(20px, 4vw, 34px);
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.5);
  }
  .glossary-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  .glossary-head h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(1.4rem, 4vw, 1.8rem);
    color:var(--ink);
    margin:0;
  }
  .glossary-progress{
    font-family:var(--font-body);
    color:var(--accent);
    font-size:0.92rem;
    margin-top:6px;
  }
  .glossary-close{
    font-family:var(--font-display);
    font-size:0.95rem;
    background:var(--btn);
    border:1.6px solid var(--gold);
    color:var(--ink);
    border-radius:999px;
    padding:8px 16px;
    cursor:pointer;
    flex:none;
  }
  .glossary-group{ margin-bottom:18px; }
  .glossary-group:last-child{ margin-bottom:0; }
  .glossary-group-title{
    font-family:var(--font-display);
    text-transform:uppercase;
    letter-spacing:0.12em;
    font-size:0.78rem;
    color:var(--accent);
    margin-bottom:8px;
  }
  /* glossary: уроки сверху, разделы сворачиваются */
  .glossary-lessons{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px; margin-bottom:6px; scrollbar-width:thin; }
  .gl-chip{ flex:none; display:flex; flex-direction:column; align-items:flex-start; gap:1px; min-height:44px; font-family:var(--font-display); background:var(--paper); border:1.5px solid var(--gold-soft); color:var(--ink); border-radius:14px; padding:8px 14px; cursor:pointer; text-align:left; touch-action:manipulation; }
  .gl-chip b{ font-size:.95rem; font-weight:600; }
  .gl-chip small{ font-family:var(--font-body); font-style:italic; color:var(--ink-soft); font-size:.88rem; }
  .gl-chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--paper); }
  .gl-chip[aria-pressed="true"] small{ color:var(--paper); opacity:.85; }
  .gl-chip:focus-visible,details.glossary-group > summary:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  details.glossary-group{ margin-bottom:10px; border:1.5px solid var(--gold-soft); border-radius:14px; }
  details.glossary-group > summary{ list-style:none; display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:46px; padding:10px 14px; cursor:pointer; }
  details.glossary-group > summary::-webkit-details-marker{ display:none; }
  .gg-title{ font-family:var(--font-display); text-transform:uppercase; letter-spacing:.1em; font-size:.78rem; color:var(--accent); min-width:0; }
  .gg-count{ flex:none; color:var(--ink-soft); font-size:.92rem; white-space:nowrap; }
  .gg-count::after{ content:' ▾'; }
  details.glossary-group[open] .gg-count::after{ content:' ▴'; }
  .gg-body{ padding:0 14px 12px; }
  .gg-body > .glossary-item:first-child{ border-top:none; padding-top:2px; }
  .glossary-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 0;
    border-top:1px solid var(--gold-soft);
    transition:opacity .15s;
  }
  .glossary-group .glossary-item:first-of-type{ border-top:none; padding-top:0; }
  .glossary-check{
    flex:none;
    display:flex;
    align-items:center;
  }
  .glossary-checkbox{
    width:20px;
    height:20px;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .glossary-main{
    flex:1 1 auto;
    min-width:0;
  }
  .glossary-word{
    font-family:var(--font-display);
    font-size:1.12rem;
    color:var(--ink);
  }
  .glossary-transcription{
    font-family:var(--font-body);
    font-style:italic;
    color:var(--ink-soft);
    font-size:0.95rem;
  }
  .glossary-ru{
    flex:none;
    max-width:42%;
    font-family:var(--font-body);
    color:var(--ink-soft);
    font-size:1rem;
    text-align:right;
  }

  /* v14: approved warm ivory page, airy photographs and readable opaque text. */
  :root{
    --bg:#f7f3e9; --paper:#fbf8f0; --paper-edge:#e5d9ba;
    --ink:#20392f; --ink-soft:#52685c; --accent:#7c2434;
    --gold:#b3862e; --gold-soft:#e2cf9c;
    --glass-a:#f0f7f3; --glass-b:#fffefa; --btn:#fffefa;
  }
  body{background:var(--bg);}
  .card{
    border-radius:26px; border:2px solid var(--gold);
    box-shadow:0 0 0 11px var(--paper) inset,0 0 0 12px #e5d9ba inset,0 16px 34px -20px rgba(32,57,47,.3);
    background:var(--paper);
    padding:clamp(25px,4.6vw,44px);
    gap:0;
    scrollbar-color:#d8c69d transparent;

  .card .series-mark{

    font-weight:700; color:#98712a; letter-spacing:.10em; margin:0 0 8px;
  }
  .card .eyebrow{

    font-size:clamp(.72rem,1.7vw,.9rem); margin:0 0 7px;
  }
  .card h2{
    flex:none; text-align:left; font-weight:700; line-height:1.17;
    font-size:clamp(1.55rem,4.5vw,2.5rem); margin:0 0 13px;
  }
  .tile-photo{
    position:relative; flex:none; width:100%; height:clamp(112px,24vw,180px);
    border:1.5px solid #d8c69d; border-radius:16px; overflow:hidden;
    background:#f3f8f4; margin:0 0 15px;
  }
  .tile-photo img{position:absolute; max-width:none; display:block; user-select:none; pointer-events:none;}
  .card[data-index="0"] .tile-photo{height:clamp(145px,34vw,265px);}
  .card[data-index="1"] .tile-photo{height:clamp(110px,21vw,170px);}
  .card[data-density="dense"] .tile-photo{height:clamp(76px,15vw,115px); margin-bottom:10px;}
  .card[data-index="0"] .scene-lines{
    flex:none; margin:0; gap:6px!important; width:100%;
    background:#fffefa; border:1px solid #dfcc9f;
    border-radius:15px; padding:clamp(13px,2.5vw,24px);
  }
  .scene-lines .es{line-height:1.28; font-family:var(--font-display); font-size:clamp(1.12rem,3.2vw,1.85rem);}
  .card[data-index="0"] > .note{display:none;}
  .card .note{line-height:1.25; padding-top:10px;}
  .glass,.op-row,.schema .grp,.tl-node{background:#fffefa;}
  .phrase-big,.face-panel,.prompt-es,.swap-out{background:#fffefa; border:1px solid #dfcc9f; border-radius:16px; padding:clamp(12px,2vw,22px);}
  .prompt-es{font-style:normal;}
  .schema{gap:0; margin:0 0 auto;}
  .schema .op-word{
    background:#fffefa; color:var(--ink); border:1.7px solid var(--gold);
    min-width:45%; text-align:center; font-weight:700; padding:6px 22px;
    font-size:clamp(1.65rem,4.7vw,2.7rem);
  }
  .schema .op-word small{display:block; font-size:.38em; color:var(--accent); letter-spacing:.10em; line-height:1.3;}
  .schema .connection{display:block; width:100%; height:clamp(35px,8vw,58px); flex:none; overflow:visible;}
  .schema .connection path{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
  .schema .connection polygon{fill:var(--gold);}
  .schema .groups{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
  .schema .grp{padding:clamp(8px,2vw,15px) 4px; border-color:#dfcc9f;}
  .schema .grp .tag{font-family:var(--font-display);font-weight:700;color:var(--accent);}
  .schema .grp .verbs{font-family:var(--font-display);font-weight:600;font-size:clamp(.9rem,2.1vw,1.35rem);line-height:1.55;}
  .schema .inf-tag{font-family:var(--font-display);font-style:normal;color:var(--ink);font-size:clamp(.9rem,1.9vw,1.1rem);margin-top:10px;text-align:center;}
  .card[data-index="1"] > .note{font-style:normal;color:var(--accent);font-weight:600;}
  .prep-visual-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:430px;margin:0 auto 11px;}
  .prep-visual-pair .tile-photo{height:auto;aspect-ratio:1/1;margin:0;}
  .prep-visual-pair .visual-label{font-family:var(--font-display);color:var(--ink);font-size:clamp(.8rem,1.8vw,1rem);text-align:center;margin-top:5px;}
  .prep-visual-pair .visual-label b{color:var(--accent);}
  .prep-direction{width:100%;padding:9px 12px;margin:0 0 11px;border:1px solid #dfcc9f;border-radius:14px;background:#fffefa;text-align:center;font-family:var(--font-display);color:var(--accent);font-size:clamp(1.05rem,2.7vw,1.4rem);}
  .illu-slot{display:none;}
  .prep-item{background:#fffefa;border:1px solid #e4d2ac!important;border-radius:14px;padding:9px 12px!important;}
  .prep-list{gap:8px;}
  .op-row{border-color:#dfcc9f;}
  .politeness{background:#fffefa;border:1px solid #dfcc9f;border-radius:15px;padding:9px 13px;margin-top:12px;}
  .line.clerk{background:#fffefa;border:1px solid #eadbb8;}
  .line.you{background:#f6e9e9;border:1px solid #e9c7cc;}
  .qa-item{background:#fffefa;border:1px solid #eadbb8!important;border-radius:12px;padding:9px 12px!important;}
  .historia{background:#fffefa;border:1px solid #dfcc9f;border-radius:15px;padding:15px;}
  .audio-slot{background:#fffefa;}
  .card button,.nav button,.glossary-fab{touch-action:manipulation;}
  @media (max-width:560px){
    .card{padding:22px;}
    .card .series-mark{font-size:.59rem;margin-bottom:5px;}
    .card .eyebrow{font-size:.68rem;margin-bottom:5px;}
    .card h2{font-size:clamp(1.28rem,5vw,1.65rem);margin-bottom:8px;}
    .schema .groups{gap:5px;}
    .schema .grp .verbs{font-size:.78rem;}
    .prep-visual-pair{gap:7px;}
    .prep-visual-pair .visual-label{font-size:.72rem;}
  }
  /* preguntas 24-26 */
  .fx-list{ display:flex; flex-direction:column; gap:5px; width:100%; margin:auto 0; }
  .fx-row{ display:grid; grid-template-columns:1fr 1.25fr; align-items:center; gap:2px 10px; border:1.5px solid var(--gold-soft); border-radius:12px; background:#fffefa; padding:4px 12px; }
  .fx-q{ font-family:var(--font-display); font-style:italic; color:var(--ink-soft); font-size:clamp(0.95rem,2.4vw,1.1rem); }

  .cm-tabs{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:8px; flex:none; }
  .cm-tabs .btn.active{ background:var(--accent); color:var(--paper); }
  .cm-lead{ text-align:center; font-family:var(--font-body); font-style:italic; color:var(--ink-soft); font-size:0.95rem; margin-bottom:6px; flex:none; }
  .cd-chain{ display:flex; flex-direction:column; gap:6px; width:100%; overflow-y:auto; flex:1 1 auto; min-height:60px; }
  .cd-q{ font-family:var(--font-display); font-style:italic; color:var(--ink-soft); font-size:1.02rem; }
  .cd-a{ font-family:var(--font-body); color:var(--accent); font-size:1.08rem; padding-left:12px; border-left:2px solid var(--gold-soft); }
  .cd-keys{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px; flex:none; }
  .cd-input{ display:flex; gap:6px; margin-top:8px; flex:none; }
  .cd-input input{ flex:1 1 auto; min-width:0; font-family:var(--font-body); font-size:16px; padding:9px 12px; border:1.4px solid var(--gold-soft); border-radius:12px; background:#fffefa; color:var(--ink); }
  .cd-input input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .cd-count{ text-align:center; font-family:var(--font-body); font-size:0.88rem; color:var(--accent); margin-top:6px; flex:none; }
  /* juegos de repaso */
  .card.is-review{ background:linear-gradient(165deg,#fffefa,#f3efe0); }
  .jg-lead{ text-align:center; font-family:var(--font-body); font-style:italic; color:var(--ink-soft); font-size:0.95rem; margin-bottom:8px; flex:none; }
  .jg-pairs{ display:grid; grid-template-columns:1fr 1fr; gap:7px; width:100%; margin:auto 0; }
  .jg-col{ display:flex; flex-direction:column; gap:7px; }
  .jg-chip{ font-family:var(--font-display); font-size:clamp(1rem,2.8vw,1.2rem); background:#fffefa; border:1.5px solid var(--gold-soft); color:var(--ink); border-radius:12px; padding:8px 10px; cursor:pointer; text-align:center; transition:background .15s, border-color .15s, opacity .2s; touch-action:manipulation; }
  .jg-chip.sel{ border-color:var(--accent); background:#f6e9ec; }
  .jg-chip.ok{ border-color:#5d8a6a; background:#e6f0e7; color:#2f5a3b; cursor:default; }
  .jg-chip.bad{ border-color:#b35a2e; background:#f8e3d8; }
  .jg-chip.used{ opacity:.25; cursor:default; }
  .jg-q{ text-align:center; font-family:var(--font-display); font-size:clamp(1.25rem,3.6vw,1.6rem); color:var(--ink); margin:6px 0 10px; }
  .jg-q .gap{ display:inline-block; min-width:3.2em; border-bottom:2px solid var(--gold); color:var(--accent); }
  .jg-opts{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .jg-built{ min-height:2.6em; border:1.5px dashed var(--gold); border-radius:14px; padding:8px 10px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; align-items:center; margin-bottom:10px; font-family:var(--font-display); font-size:clamp(1.05rem,3vw,1.3rem); color:var(--accent); }
  .jg-built.col{ flex-direction:column; align-items:stretch; font-size:1rem; }
  .jg-built.col .ln{ font-family:var(--font-body); color:var(--ink); text-align:left; }
  .jg-built.col .ln.q{ font-style:italic; color:var(--ink-soft); }
  .jg-built.col .ln.a{ color:var(--accent); padding-left:10px; border-left:2px solid var(--gold-soft); }
  .jg-pool{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; }
  .jg-pool.col{ flex-direction:column; align-items:stretch; }
  .jg-pool.col .jg-chip{ font-family:var(--font-body); font-size:0.98rem; text-align:left; }
  .jg-status{ text-align:center; font-family:var(--font-body); color:var(--ink-soft); font-size:0.9rem; margin-top:8px; flex:none; }
  .jg-win{ text-align:center; font-family:var(--font-display); color:#2f5a3b; font-size:clamp(1.2rem,3.4vw,1.5rem); margin-top:8px; flex:none; }
  .jg-again{ display:block; margin:8px auto 0; }
  @keyframes jgshake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  .jg-chip.bad{ animation:jgshake .25s; }
  @media (prefers-reduced-motion: reduce){ .jg-chip.bad{ animation:none; } }
  .jg-badge{ position:fixed; left:18px; bottom:18px; z-index:50; font-family:var(--font-display); font-size:1rem; background:#fffefa; color:var(--ink); border:1.6px solid var(--gold); border-radius:999px; padding:11px 18px; box-shadow:0 10px 24px -12px rgba(32,57,47,0.45); }
  .jg-pts{ text-align:center; font-family:var(--font-body); color:var(--accent); font-size:1rem; margin-top:2px; }
  /* ===== Материал 2 · Puedo: дополнения к стилям серии ===== */
  :root{ color-scheme:light; }
  .card{ min-height:0; }
  .card[hidden]{ display:none; }
  .circ{
    background:#fffefa; border:1px solid #dfcc9f; border-radius:15px;
    padding:clamp(14px,2.6vw,26px); font-family:var(--font-body);

  .bc{ min-width:0; border:1.5px solid var(--gold-soft); border-radius:10px; padding:6px 6px; background:#fffefa; text-align:center; }

  /* ===== Формат App: без рамки-карточки, листается вся страница, навигация закреплена ===== */

  function decorateLessonPage(card,index){

  const deck = document.getElementById('deck');

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  let current = 0;
  const cards = [];
  const nodes = [];

  steps.forEach((s, i) => {
    const card = document.createElement('section');
    card.className = 'card' + (s.review ? ' is-review' : '');
    card.hidden = i !== 0;
    const mark = mk('div', 'series-mark'); mark.textContent = 'LA CIUDAD DE LOS SENTIDOS';
    const eyebrow = mk('div', 'eyebrow'); eyebrow.textContent = s.eyebrow;
    const h2 = document.createElement('h2'); h2.textContent = s.title;
    card.append(mark, eyebrow, h2);
    s.render(card);
    decorateLessonPage(card,i);
    deck.appendChild(card);
    cards.push(card);

    const node = mk('div', 'node' + (i === 0 ? ' active' : ''));
    node.textContent = i + 1;
    node.addEventListener('click', () => showStep(i));
    stepperEl.appendChild(node);
    nodes.push(node);
    if (i < steps.length - 1) stepperEl.appendChild(mk('div', 'line'));
  });

  function showStep(idx){
    idx = Math.max(0, Math.min(steps.length - 1, idx));
    cards.forEach((c, i) => c.hidden = i !== idx);
    nodes.forEach((n, i) => n.classList.toggle('active', i === idx));
    current = idx;
    progressLabel.textContent = 'Шаг ' + (idx + 1) + ' из ' + steps.length;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === steps.length - 1;
    try { nodes[idx].scrollIntoView({block:'nearest', inline:'center'}); } catch (e) {}
    window.scrollTo({top: 0});
  }
  prevBtn.addEventListener('click', () => showStep(current - 1));
  nextBtn.addEventListener('click', () => showStep(current + 1));
  showStep(0);

  /* ---------- игры на повтор ---------- */
  const JG_MAX = {g1:8, g2:12, g3:15, g4:16, g5:10};
  const JG_KEY = 'ciudad_juegos_puntos_es_m2';
  let jgBest = {};
  try { jgBest = JSON.parse(localStorage.getItem(JG_KEY) || '{}') || {}; } catch (e) {}
  const jgTotalMax = Object.values(JG_MAX).reduce((a, b) => a + b, 0);
  const jgBadge = mk('div', 'jg-badge'); const toolsEl = document.getElementById('tools'); toolsEl.appendChild(jgBadge);
  const fabEl = mk('button', 'glossary-fab'); fabEl.id = 'glossaryFab'; fabEl.type = 'button'; fabEl.textContent = '📖 Словарь'; toolsEl.appendChild(fabEl);
  function jgUpdateBadge(){ const t = Object.values(jgBest).reduce((a, b) => a + (b || 0), 0); jgBadge.textContent = '⭐ ' + t + ' из ' + jgTotalMax; }
  jgUpdateBadge();
  function jgResult(id, raw, errors){
    const pts = Math.max(0, raw - errors);
    const prev = jgBest[id] || 0;
    if (pts > prev) { jgBest[id] = pts; try { localStorage.setItem(JG_KEY, JSON.stringify(jgBest)); } catch (e) {} jgUpdateBadge(); }
    const best = Math.max(pts, prev);
    return `+${pts} ${pts === 1 ? 'балл' : (pts >= 2 && pts <= 4 ? 'балла' : 'баллов')} из ${JG_MAX[id]}` + (prev && pts <= prev ? ` · лучший: ${best}` : '');
  }
  function jgLive(raw, errors){ return ' · ⭐ ' + Math.max(0, raw - errors); }
  function jgShuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function jgWin(errors, total){ return errors === 0 ? `¡Perfecto! ${total} из ${total} без ошибок` : `¡Bien! ${total} из ${total} · ошибок: ${errors}`; }
  function jgFrame(card, lead){
    card.appendChild(mk('div', 'jg-lead', '')).textContent = lead;
    const box = mk('div'); box.style.cssText = 'width:100%;margin:auto 0'; card.appendChild(box);
    const st = mk('div', 'jg-status'); card.appendChild(st);
    return {box, st};
  }
  function jgAgain(fn){ const b = mk('button', 'btn small ghost jg-again'); b.type = 'button'; b.textContent = 'Ещё раз'; b.addEventListener('click', fn); return b; }

  // Juego 1 — пары: слово ↔ перевод, каждый раз случайные восемь
  function renderJuego1(card){
    const pool = [['pagar','платить'],['esperar','ждать'],['entregar','сдать, передать'],['llamar','звонить'],['repetir','повторить'],['explicar','объяснить'],['escribir','написать'],['enviar','отправить'],['ganar dinero','зарабатывать'],['hablar despacio','говорить медленно'],['puedes','ты можешь'],['podemos','мы можем'],['pueden','они могут'],['quieres','ты хочешь'],['queremos','мы хотим']];
    const {box, st} = jgFrame(card, 'Нажми испанское слово, потом его перевод. Пара — 1 балл, ошибка — минус 1.');
    function start(){
      const pairs = jgShuffle(pool).slice(0, 8);
      box.innerHTML = ''; st.innerHTML = '';
      let sel = null, done = 0, errors = 0;
      const grid = mk('div', 'jg-pairs'); const L = mk('div', 'jg-col'); const R = mk('div', 'jg-col');
      jgShuffle(pairs).forEach(p => { const c = mk('button', 'jg-chip'); c.type = 'button'; c.textContent = p[0]; c.dataset.k = p[0]; c.dataset.side = 'es'; L.appendChild(c); });
      jgShuffle(pairs).forEach(p => { const c = mk('button', 'jg-chip'); c.type = 'button'; c.textContent = p[1]; c.dataset.k = p[0]; c.dataset.side = 'ru'; R.appendChild(c); });
      grid.append(L, R); box.appendChild(grid);
      st.textContent = 'Пар: 0 из ' + pairs.length;
      grid.addEventListener('click', e => {
        const c = e.target.closest('.jg-chip'); if (!c || c.classList.contains('ok')) return;
        if (!sel || sel.dataset.side === c.dataset.side) { if (sel) sel.classList.remove('sel'); sel = c; c.classList.add('sel'); return; }
        if (sel.dataset.k === c.dataset.k) {
          sel.classList.remove('sel'); sel.classList.add('ok'); c.classList.add('ok'); sel = null; done++;
          st.textContent = 'Пар: ' + done + ' из ' + pairs.length + jgLive(done, errors);
          if (done === pairs.length) { st.innerHTML = ''; const w = mk('div', 'jg-win'); w.textContent = jgWin(errors, pairs.length); const pt = mk('div', 'jg-pts'); pt.textContent = jgResult('g1', pairs.length, errors); st.append(w, pt, jgAgain(start)); }
        } else { errors++; c.classList.add('bad'); setTimeout(() => c.classList.remove('bad'), 400); }
      });
    }
    start();
  }

  // движок «вставь слово» (первый вариант в o — правильный, p — баллы за пункт, h — подсказка)
  function jgFill(card, lead, items, id, per){
    const {box, st} = jgFrame(card, lead);
    function start(){
      box.innerHTML = ''; st.innerHTML = '';
      let k = 0, errors = 0, earned = 0; const order = jgShuffle(items);
      const q = mk('div', 'jg-q'); const hint = mk('div', 'jg-hint'); const opts = mk('div', 'jg-opts');
      box.append(q, hint, opts);
      function show(){
        const it = order[k]; const parts = it.s.split('___');
        q.innerHTML = ''; q.append(parts[0]); const g = mk('span', 'gap'); g.textContent = ' '; q.append(g, parts[1] || '');
        hint.textContent = it.h || ''; hint.hidden = !it.h;
        opts.innerHTML = '';
        jgShuffle(it.o).forEach(o => {
          const b = mk('button', 'jg-chip'); b.type = 'button'; b.textContent = o;
          b.addEventListener('click', () => {
            if (o === it.o[0]) {
              g.textContent = o; b.classList.add('ok'); opts.querySelectorAll('.jg-chip').forEach(x => x.disabled = true);
              earned += (it.p || per);
              setTimeout(() => { k++; if (k < order.length) { st.textContent = 'Фраза ' + (k + 1) + ' из ' + order.length + jgLive(earned, errors); show(); } else finish(); }, 700);
            } else { errors++; b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 400); }
          });
          opts.appendChild(b);
        });
      }
      function finish(){ opts.innerHTML = ''; hint.hidden = true; st.innerHTML = ''; const w = mk('div', 'jg-win'); w.textContent = jgWin(errors, order.length); const pt = mk('div', 'jg-pts'); pt.textContent = jgResult(id, earned, errors); st.append(w, pt, jgAgain(start)); }
      st.textContent = 'Фраза 1 из ' + order.length; show();
    }
    start();
  }

  // движок «собери по порядку»
  function jgOrder(card, lead, tasks, vertical, id, per){
    const {box, st} = jgFrame(card, lead);
    function start(){
      box.innerHTML = ''; st.innerHTML = '';
      let t = 0, errors = 0; const list = vertical ? tasks : jgShuffle(tasks);
      const built = mk('div', 'jg-built' + (vertical ? ' col' : '')); const pool = mk('div', 'jg-pool' + (vertical ? ' col' : ''));
      box.append(built, pool);
      function show(){
        const parts = list[t]; let pos = 0;
        built.innerHTML = ''; pool.innerHTML = '';
        jgShuffle(parts.map((p, i) => [p, i])).forEach(([p]) => {
          const b = mk('button', 'jg-chip'); b.type = 'button'; b.textContent = p;
          b.addEventListener('click', () => {
            if (b.classList.contains('used')) return;
            if (p === parts[pos]) {
              b.classList.add('used'); b.disabled = true;
              const s = document.createElement('span'); s.textContent = p;
              if (vertical) s.className = 'ln ' + (pos % 2 === 0 ? 'q' : 'a');
              built.appendChild(s); pos++;
              if (pos === parts.length) {
                setTimeout(() => { t++; if (t < list.length) { st.textContent = (vertical ? 'Разговор ' : 'Фраза ') + (t + 1) + ' из ' + list.length + jgLive(t * per, errors); show(); } else finish(); }, vertical ? 1600 : 900);
              }
            } else { errors++; b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 400); }
          });
          pool.appendChild(b);
        });
      }
      function finish(){ pool.innerHTML = ''; st.innerHTML = ''; const w = mk('div', 'jg-win'); w.textContent = vertical ? (errors === 0 ? '¡Perfecto! Разговоры собраны без ошибок' : '¡Bien! Разговоры собраны · ошибок: ' + errors) : jgWin(errors, list.length); const pt = mk('div', 'jg-pts'); pt.textContent = jgResult(id, list.length * per, errors); st.append(w, pt, jgAgain(start)); }
      st.textContent = list.length > 1 ? (vertical ? 'Разговор 1 из ' : 'Фраза 1 из ') + list.length : ''; show();
    }
    start();
  }

  const CURRENT_LESSON = '2';
  const GLOSSARY_STORAGE_KEY = 'ciudad_glossary_known_es';
  const OWN_STORAGE_KEY = 'ciudad_glossary_own_es';
  function gmk(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
  function gload(key){ try { return JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) { return {}; } }
  function gsave(key, obj){ try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {} }
  const knownWords = gload(GLOSSARY_STORAGE_KEY);
  const ownWords = gload(OWN_STORAGE_KEY);
  const wordKey = w => w.trim().toLowerCase().replace(/\s+/g, ' ');
  const groupKey = (lesson, g) => lesson.id + '|' + g.group;
  /* Перенос старых отметок урока 1: раньше ключом был номер раздела и слова («0-3»). */
  (function migrateLegacy(){
    const LEGACY = [{"g": "Операторы", "w": ["querer", "quiero", "quisiera", "quería", "no puedo", "voy a", "¿quiere?"]}, {"g": "Глаголы в инфинитиве", "w": ["hablar", "estudiar", "aprender", "entender", "vivir", "conducir", "ayudar", "pedir", "recibir"]}, {"g": "Глагол + предлог (пара фиксирована)", "w": ["vivir en", "ayudar a", "salir de", "llamar a"]}, {"g": "Слова материала", "w": ["la compra", "a domicilio", "un pan", "la leche", "unos huevos", "la tienda", "mañana", "por la mañana", "por la tarde", "a las diez", "hoy"]}, {"g": "Вежливые слова диалога", "w": ["buenos días", "gracias", "por favor", "¿diga?", "sí / no", "claro", "sin problema", "algo más", "eso es todo"]}, {"g": "Вопросы-ключи", "w": ["¿Cuándo?", "¿A qué hora?", "¿Qué quieres hacer?", "¿Qué?", "¿Adónde?", "¿Dónde?", "¿Por qué? → porque", "¿Para qué? → para", "¿Cómo?", "¿Y tú?"]}];
    let changed = false;
    Object.keys(knownWords).forEach(k => {
      const m = /^(\d+)-(\d+)$/.exec(k); if (!m) return;
      const grp = LEGACY[+m[1]], w = grp && grp.w[+m[2]];
      if (w && knownWords[k]) knownWords[wordKey(w)] = true;
      delete knownWords[k]; changed = true;
    });
    if (changed) gsave(GLOSSARY_STORAGE_KEY, knownWords);
    let ownChanged = false;
    Object.keys(ownWords).forEach(k => {
      if (!/^\d+$/.test(k)) return;
      const grp = LEGACY[+k];
      if (grp) { const nk = '1|' + grp.g; ownWords[nk] = (ownWords[nk] || []).concat(ownWords[k] || []); }
      delete ownWords[k]; ownChanged = true;
    });
    if (ownChanged) gsave(OWN_STORAGE_KEY, ownWords);
  })();
  const openState = {};
  let activeLesson = CURRENT_LESSON;
  let chipCountEls = {}, groupCountEls = {};

  function groupStats(lesson, g){
    let total = g.items.length, known = g.items.filter(it => knownWords[wordKey(it.w)]).length;
    (ownWords[groupKey(lesson, g)] || []).forEach(o => { total++; if (o.k) known++; });
    return {total, known};
  }
  function lessonStats(lesson){
    let total = 0, known = 0;
    lesson.groups.forEach(g => { const s = groupStats(lesson, g); total += s.total; known += s.known; });
    return {total, known};
  }
  function updateCounts(){
    let total = 0, known = 0;
    GLOSSARY.forEach(l => {
      const s = lessonStats(l); total += s.total; known += s.known;
      if (chipCountEls[l.id]) chipCountEls[l.id].textContent = s.known + ' из ' + s.total;
      l.groups.forEach(g => { const el = groupCountEls[groupKey(l, g)]; if (el) { const gs = groupStats(l, g); el.textContent = gs.known + ' из ' + gs.total; } });

    if (el) el.textContent = 'Знаю: ' + known + ' из ' + total;
  }
  function makeItem(word, tr, ru, checked, opts){
    const item = gmk('div', 'glossary-item' + (checked ? ' is-known' : '') + (opts.own ? ' is-own' : ''));

  function centerChip(){
    const row = document.querySelector('.glossary-lessons'); const act = row && row.querySelector('[aria-pressed="true"]');

  function buildGlossary(keepScroll){

      };

  }
  document.getElementById('glossaryBody').addEventListener('change', e => {
    const cb = e.target.closest('.glossary-checkbox'); if (!cb) return;

  document.getElementById('glossaryBody').addEventListener('click', e => {
    const del = e.target.closest('.glossary-del'); if (!del) return;

  document.getElementById('glossaryFab').addEventListener('click', () => setTimeout(centerChip, 0));

  const glossaryOverlay = document.getElementById('glossaryOverlay');
  document.getElementById('glossaryFab').addEventListener('click', () => { glossaryOverlay.hidden = false; });
