<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habitación 1 · Ser, estar, hay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Дорогая тетрадь: молочная лощёная бумага, мелкая клетка, поле красной линией. Шаги: объяснение золотом, практика сиренью, разговор зелёным. */
  --paper:#fbf8f1;
  --sheet:#fffdf8;
  --grid:rgba(120,140,170,.16);
  --margin:rgba(205,92,92,.45);
  --ink:#2b2836;
  --muted:#6f6a7c;
  --lilac:#8a7bb8;
  --lilac-soft:#ece8f6;
  --theory:#c4952f;
  --theory-soft:#f7eed9;
  --talk:#4f9a6b;
  --gold:#a8761c;
  --caramel:#b0622a;
  --line:#e4ded2;
  --ok:#3f8a5a;
  --bad:#c0504d;
  --display:"Young Serif", Georgia, serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
body{background-color:var(--paper);
  background-image:
    linear-gradient(90deg, transparent 0, transparent calc(50% - 392px), var(--margin) calc(50% - 392px), var(--margin) calc(50% - 390px), transparent calc(50% - 390px)),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:100% 100%, 14px 14px, 14px 14px;background-attachment:fixed}
@media (max-width:820px){body{background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);background-size:14px 14px,14px 14px}}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 56px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac);font-weight:700}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.seg{display:inline-flex;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lilac);color:#fff}
.card{position:relative;overflow:hidden;background:linear-gradient(135deg,#ffffff 0%,var(--sheet) 45%,#f7f2e8 100%);
  border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 1px 0 #fff inset, 0 10px 28px rgba(60,50,30,.08), 0 2px 6px rgba(60,50,30,.05)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 32%, rgba(255,255,255,0) 68%, rgba(255,255,255,.45) 100%)}
.card > *{position:relative}
.card.theory{border-top:4px solid var(--theory)}
.card.practice{border-top:4px solid var(--lilac)}
.meta{font-size:13px;color:var(--muted);letter-spacing:.04em}
.title{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.v{color:var(--gold);font-weight:800}
.g{color:var(--ok);font-weight:800}
.vo{color:var(--caramel);font-style:italic}
details{background:var(--lilac-soft);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:600}
.prompt{color:var(--muted);font-size:15px;margin:0}
.chapter p{margin:0 0 14px;font-size:18px;line-height:1.7}
.btn{border:0;background:var(--lilac);color:#fff;font:700 16px var(--body);padding:12px 18px;border-radius:12px;cursor:pointer;box-shadow:0 4px 12px rgba(138,123,184,.3)}
.btn.gold{background:var(--theory);box-shadow:0 4px 12px rgba(196,149,47,.3)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{font-size:14px;padding:8px 12px}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.seg button:focus-visible,.pill:focus-visible,.tile:focus-visible,.w:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}


.where{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.fact{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.fact b{font:400 26px var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted)}
.plan{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.hook{background:linear-gradient(135deg,#fff7df,#f7eed9);border:1px solid var(--theory);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}

/* витрина: презентация и итоги — в стиле шагов-объяснений */
.showcase{gap:16px}
.showcase .kicker{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.showcase h2.cover{font:400 28px/1.2 var(--display);margin:0;color:var(--ink);text-wrap:balance}
.showcase .lede{font:400 17px/1.55 var(--body);color:var(--muted);margin:0;max-width:60ch}
.showcase .rule{height:1px;background:var(--line);border:0;margin:2px 0}
.showcase h3{font:400 21px/1.25 var(--display);margin:4px 0 0;color:var(--ink)}
.showcase p,.showcase li{font:400 17px/1.6 var(--body);color:var(--ink)}
.showcase .where{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 0 10px;font:500 13px var(--body);color:var(--muted)}
.showcase .where b{font-weight:700;color:var(--ink)}
.numbers{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.numbers div{flex:1 1 100px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.numbers div:last-child{border-right:0}
.numbers b{font:400 28px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.numbers span{font:400 13px var(--body);color:var(--muted)}
.steps-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps-list li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:s}
.steps-list li::before{content:counter(s);font:400 22px/1.2 var(--display);color:var(--theory)}
.steps-list b{font-weight:700}
.showcase .quote{border-left:3px solid var(--theory);padding:4px 0 4px 14px;font:400 18px/1.55 var(--body);color:var(--ink);margin:0}
.showcase .note{font:400 15px/1.6 var(--body);color:var(--ink);background:var(--theory-soft);border-radius:12px;padding:10px 14px;margin:0}
.showcase table td,.showcase table th{font-size:15px;border-bottom:1px solid var(--line)}
.showcase .btn{align-self:flex-start}
@media (max-width:480px){.showcase h2.cover{font-size:24px}}
/* награды */
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:700 14px var(--body);display:inline-flex;gap:6px;align-items:center}
.stat b{font-variant-numeric:tabular-nums}
.seals{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.seal{border:2px dashed var(--line);border-radius:14px;padding:12px;text-align:center;font-size:13px;color:var(--muted);min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.seal.on{border-style:solid;border-color:var(--theory);background:radial-gradient(circle at 30% 30%,#fff7df,#f3e2b5);color:var(--ink)}
.seal .stamp{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 20px var(--display);background:var(--line);color:#fff}
.seal.on .stamp{background:linear-gradient(135deg,#d8a845,#a8761c);box-shadow:0 2px 6px rgba(168,118,28,.4)}
.titlebadge{background:linear-gradient(135deg,#fff7df,#f1dca6);border:2px solid var(--theory);border-radius:14px;padding:14px;text-align:center;font:400 22px var(--display)}
/* лента шагов как в «Архитектуре речи» */
.stepper{position:relative;display:flex;align-items:center;overflow-x:auto;padding:4px 2px 8px;scroll-behavior:auto}
.stepper .node{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--sheet);color:var(--ink);font:700 15px var(--display);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;text-decoration:none}
.stepper .node.t{border-color:var(--theory);background:var(--theory-soft)}
.stepper .node.p{border-color:var(--lilac);background:var(--lilac-soft)}
.stepper .node.h{border-color:var(--talk);background:#e4f2e8}
.stepper .node.soon{border-style:dashed;color:var(--muted);background:transparent;cursor:default;font-size:12px}
.stepper .node.done::after{content:"✓";position:absolute;right:-4px;top:-6px;font:800 12px var(--body);color:#fff;background:var(--ok);border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.stepper .node.active.t{background:var(--theory);color:#fff}
.stepper .node.active.p{background:var(--lilac);color:#fff}
.stepper .node.active.h{background:var(--talk);color:#fff}
.card.talk{border-top:4px solid var(--talk)}
.btn.green{background:var(--talk);box-shadow:0 4px 12px rgba(79,154,107,.3)}
.answer{border-left:3px solid var(--talk);padding:6px 0 6px 14px;font-size:20px;line-height:1.5}
.answer .t{color:var(--talk);font-style:italic}
.stepper .line{flex:1 1 10px;min-width:8px;height:2px;background:var(--line)}
.progress-label{text-align:center;font:400 15px var(--display);color:var(--muted);letter-spacing:.04em}
.nav{display:flex;justify-content:space-between;gap:10px}
/* тропинка шагов */
.path{display:flex;flex-direction:column;gap:12px}
.box{display:flex;flex-direction:column;gap:6px}
.box-name{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:2px solid var(--line);background:var(--sheet);color:var(--ink);font:700 13px var(--body);padding:6px 10px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill.t{border-color:var(--theory);background:var(--theory-soft)}
.pill.p{border-color:var(--lilac);background:var(--lilac-soft)}
.pill.h{border-color:var(--talk);background:#e4f2e8;text-decoration:none;color:var(--ink)}
.pill.soon{border-style:dashed;color:var(--muted);cursor:default;background:transparent}
.pill[aria-current="true"]{box-shadow:0 0 0 3px rgba(138,123,184,.35)}
.pill.t[aria-current="true"]{box-shadow:0 0 0 3px rgba(196,149,47,.35)}
.pill .ck{color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* объяснение */
.dv{font-family:var(--display);font-size:21px;margin:0}
.ru{margin:0;font-size:17px}
.examples{display:flex;flex-direction:column;gap:4px;font-size:20px;padding-left:14px;border-left:3px solid var(--theory)}
.es{margin:0;color:var(--muted);font-style:italic}
.tip{background:var(--theory-soft);border-radius:12px;padding:10px 14px;font-size:15px}

/* практика */
.q{font-family:var(--display);font-size:25px;line-height:1.3;margin:0;text-wrap:balance}
.who{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.built{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(255,255,255,.6)}
.built.empty::after{content:"Toca las palabras en orden";color:var(--muted);font-size:14px;padding:0 6px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:1px solid var(--line);background:#fff;color:var(--ink);font:600 18px var(--body);padding:8px 13px;border-radius:10px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.tile.used{visibility:hidden}
.built .tile{background:var(--lilac-soft);border-color:var(--lilac)}
.verdict{border-radius:12px;padding:12px 14px;font-size:18px}
.verdict.ok{background:#e4f2e8;border-left:4px solid var(--ok)}
.verdict.bad{background:#f8e6e4;border-left:4px solid var(--bad)}
.verdict .lab{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:2px}
.verdict.ok .lab{color:var(--ok)} .verdict.bad .lab{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lilac)}

/* слова и словарь */
.w{cursor:pointer;border-bottom:1px dotted rgba(111,106,124,.5)}
.w:hover{background:var(--lilac-soft)}
.pop{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(420px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 14px 40px rgba(40,30,20,.18);z-index:20;display:flex;flex-direction:column;gap:8px}
.pop .word{font-family:var(--display);font-size:22px}
.overlay{position:fixed;inset:0;background:rgba(43,40,54,.35);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.sheet{background:var(--sheet);border-radius:16px;max-width:620px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
table{border-collapse:collapse;width:100%;font-size:16px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
tr.yo td{background:var(--theory-soft);font-weight:800}
.dict-item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:8px 0}
.dict-item small{color:var(--muted);display:block}
@media (max-width:420px){h1{font-size:25px}.q{font-size:22px}.examples{font-size:18px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<script>
/* ===== Данные ===== */
const BOXES = [
 {id:"ser", name:"SER · quién soy", distract:["estoy","eres"],
  theory:{dv:"— ¿Quién eres? — pregunta Don Verbo.",
    ru:"<b class=\"v\">Soy</b> — это кто я: моя роль, мой характер, откуда я.",
    ex:["Soy estudiante.","Soy nuev{a|o}.","Soy tímid{a|o}."],
    es:"Con «soy» digo quién soy por dentro.",
    tip:"Дон Вербо спрашивает «¿Eres…?» — это «ты». Ты отвечаешь «Soy…» — это «я»."},
  practice:[
   {title:"Responde a Don Verbo", who:"Don Verbo pregunta", items:[
    ["¿Eres estudiante de español?","Sí, soy estudiante de español."],
    ["¿Eres profesor{a|}?","No, no soy profesor{a|}."],
    ["¿Eres nuev{a|o} aquí?","Sí, soy nuev{a|o} aquí."],
    ["¿Eres tímid{a|o}?","Sí, soy un poco tímid{a|o}."],
    ["¿Eres valiente?","No, no soy muy valiente."],
    ["¿Eres curios{a|o}?","Sí, soy curios{a|o}."],
    ["¿Eres alumn{a|o} de Don Verbo?","Sí, soy alumn{a|o} de Don Verbo."],
    ["¿Eres español{a|}?","No, no soy español{a|}."]]},
   {title:"Corrige a Don Verbo", who:"Don Verbo se equivoca", items:[
    ["Eres profesor{a|}, ¿verdad?","No, no soy profesor{a|}. Soy estudiante."],
    ["Eres muy valiente, ¿verdad?","No, no soy valiente. Soy tímid{a|o}."],
    ["Eres de aquí, ¿verdad?","No, no soy de aquí. Soy de otra ciudad."],
    ["Eres expert{a|o} en español, ¿verdad?","No, no soy expert{a|o}. Soy principiante."],
    ["Eres mud{a|o}, ¿verdad?","No, no soy mud{a|o}. Soy callad{a|o}."],
    ["Eres aburrid{a|o}, ¿verdad?","No, no soy aburrid{a|o}. Soy curios{a|o}."],
    ["Eres {la dueña|el dueño} de la cocina, ¿verdad?","No, no soy {la dueña|el dueño}. Soy invitad{a|o}."],
    ["Eres un verbo, ¿verdad?","No, no soy un verbo. Soy una persona."]]}
  ]},
 {id:"estar", name:"ESTAR · dónde y cómo estoy", distract:["soy","estás"],
  theory:{dv:"— ¿Dónde estás? ¿Cómo estás? — pregunta Don Verbo.",
    ru:"<b class=\"v\">Estoy</b> — где я и как я сейчас: место и состояние.",
    ex:["Estoy en la cocina.","Estoy sol{a|o}.","Estoy nervios{a|o}."],
    es:"Con «estoy» digo dónde estoy y cómo me siento ahora.",
    tip:"Дон Вербо спрашивает «¿Estás…?» — это «ты». Ты отвечаешь «Estoy…» — это «я»."},
  practice:[
   {title:"Responde a Don Verbo", who:"Don Verbo pregunta", items:[
    ["¿Estás en el salón?","No, no estoy en el salón."],
    ["¿Estás en la cocina?","Sí, estoy en la cocina."],
    ["¿Estás sol{a|o} en casa?","Sí, estoy sol{a|o} en casa."],
    ["¿Estás nervios{a|o}?","Sí, estoy un poco nervios{a|o}."],
    ["¿Estás cansad{a|o}?","Sí, estoy cansad{a|o}."],
    ["¿Estás en el Reino del Caramelo?","Sí, estoy en el Reino del Caramelo."],
    ["¿Estás perdid{a|o}?","Sí, estoy un poco perdid{a|o}."],
    ["¿Estás list{a|o} para hablar?","Sí, estoy list{a|o}."]]},
   {title:"Corrige a Don Verbo", who:"Don Verbo se equivoca", items:[
    ["Estás en el baño, ¿verdad?","No, no estoy en el baño. Estoy en la cocina."],
    ["Estás aburrid{a|o}, ¿verdad?","No, no estoy aburrid{a|o}. Estoy sorprendid{a|o}."],
    ["Estás muy tranquil{a|o}, ¿verdad?","No, no estoy tranquil{a|o}. Estoy nervios{a|o}."],
    ["Estás dormid{a|o}, ¿verdad?","No, no estoy dormid{a|o}. Estoy despiert{a|o}."],
    ["Estás enfadad{a|o}, ¿verdad?","No, no estoy enfadad{a|o}. Estoy asustad{a|o}."],
    ["Estás lejos de la mesa, ¿verdad?","No, no estoy lejos. Estoy cerca de la mesa."],
    ["Estás sentad{a|o}, ¿verdad?","No, no estoy sentad{a|o}. Estoy de pie."],
    ["Estás triste, ¿verdad?","No, no estoy triste. Estoy emocionad{a|o}."]]}
  ]},
 {id:"serestar", name:"✖ SER + ESTAR", distract:["es","está"],
  theory:{dv:"— Soy y estoy: dos verbos, dos preguntas — dice Don Verbo.",
    ru:"<b class=\"v\">Soy</b> — кто я: роль, характер, откуда я. <b class=\"v\">Estoy</b> — где я и как я сейчас.",
    ex:["Soy tranquil{a|o}, pero ahora estoy nervios{a|o}.","Soy de otra ciudad, pero estoy en el Reino del Caramelo."],
    es:"¿Quién soy? → soy. ¿Dónde estoy? ¿Cómo estoy ahora? → estoy.",
    tip:"Проверь себя вопросом. «Это про то, кто я?» → soy. «Где я или как я себя чувствую сейчас?» → estoy. Подробно — в Chuleta."},
  practice:[
   {title:"¿Soy o estoy?", type:"choice", who:"Elige", items:[
    ["___ en la cocina de Don Verbo.","estoy"],
    ["___ estudiante de español.","soy"],
    ["Ahora ___ nervios{a|o}.","estoy"],
    ["___ de otra ciudad.","soy"],
    ["___ sol{a|o} en casa.","estoy"],
    ["___ una persona tranquila.","soy"],
    ["___ cansad{a|o}: es de noche.","estoy"],
    ["___ alumn{a|o} de Don Verbo.","soy"],
    ["___ delante de la mesa.","estoy"],
    ["___ curios{a|o}.","soy"],
    ["___ un poco perdid{a|o}.","estoy"],
    ["___ principiante.","soy"]]},
   {title:"Soy así, pero ahora…", type:"tiles", who:"Don Verbo: ¿Cómo eres? ¿Y cómo estás ahora?", items:[
    [["tranquil{a|o}","nervios{a|o}"],"Soy tranquil{a|o}, pero ahora estoy nervios{a|o}."],
    [["alegre","asustad{a|o}"],"Soy alegre, pero ahora estoy asustad{a|o}."],
    [["de otra ciudad","en el Reino del Caramelo"],"Soy de otra ciudad, pero ahora estoy en el Reino del Caramelo."],
    [["trabajador{a|}","cansad{a|o}"],"Soy trabajador{a|}, pero ahora estoy cansad{a|o}."],

/* ===== Помощники ===== */
function boxName(st){return st.box===-3?'Presentación':st.box===-1?'El texto':st.box===-2?'Hablamos con Don Verbo':st.box===-4?'Final':BOXES[st.box].name;}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function G(s){return s.replace(/\{([^|}]*)\|([^}]*)\}/g,(m,f,ma)=>S.g==="f"?f:ma);}
function gmark(s){return s.replace(/\{([^|}]*)\|([^}]*)\}/g,(m,f,ma)=>{const x=S.g==="f"?f:ma;return x?x.split(" ").map(w=>"\u0001"+w+"\u0002").join(" "):"";});}
const strip=w=>w.replace(/[.,:;!¡¿?«»—…]/g,"");
function tokens(a){return G(a).split(/\s+/).map(strip).filter(Boolean);}
/* текст с нажимаемыми словами; род выделен, soy/estoy выделены */
function tap(s,verbs){
  const ctx=encodeURIComponent(G(s));
  return gmark(s).split(/(\s+)/).map(part=>{
    if(/^\s+$/.test(part)||!part) return part.includes("\n")?"<br>":part;
    const m=part.match(/^([¡¿«—]*)(.*?)([.,:;!?»…]*)$/);
    let [,pre,core,post]=m;
    const isG=core.includes("\u0001");
    const plainCore=core.replace(/[\u0001\u0002]/g,"");
    const key=plainCore.toLowerCase();
    let inner=esc(core).replace(/\u0001/g,'<span class="g">').replace(/\u0002/g,"</span>");
    if(verbs){ if(YO.has(key)) inner='<span class="v">'+inner+'</span>'; else if(OTHER.has(key)) inner='<span class="vo">'+inner+'</span>'; }
    else if(/^(soy|estoy)$/.test(key)) inner='<span class="v">'+inner+'</span>';
    const w=DICT[key]?'<span class="w" tabindex="0" data-w="'+esc(key)+'" data-ctx="'+ctx+'">'+inner+'</span>':inner;
    return esc(pre)+w+esc(post);
  }).join("");
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function boxOf(st){return BOXES[st.box];}
function resOf(key){return S.res[key]||(S.res[key]={done:[],ok:[]});}
function stepDone(i){const st=STEPS[i];
  if(st.type==="i") return !!S.res["intro"];
  if(st.type==="r") return !!S.res["results"];
  if(st.type==="x") return !!S.res["chapter"];
  if(st.type==="h") return !!S.res["talk-"+st.hb];
  if(st.type==="t") return !!S.res["t-"+st.box];
  if(st.type==="p"){const r=S.res[st.key];return r&&r.done.length>=boxOf(st).practice[st.pi].items.length;}
  const b=boxOf(st);const all=b.practice.every((p,pi)=>stepDone(STEPS.findIndex(x=>x.key===b.id+"-"+pi)));
  return all && !(S.err[b.id]||[]).length;}

const TITLE={f:"Habitante de la cocina",m:"Habitante de la cocina"};
function errIndex(bi){return STEPS.findIndex(s=>s.type==="e"&&s.box===bi);}
function stats(){
  let pts=0;Object.keys(S.res).forEach(k=>{const r=S.res[k];if(r&&r.ok)pts+=r.ok.length;});
  const stars=STEPS.filter((s,i)=>(s.type==="p"||s.type==="e"||s.type==="h")&&stepDone(i)).length;
  const seals=BOXES.filter((b,bi)=>stepDone(errIndex(bi))).length;
  return {pts,stars,seals};
}

      h+='<p class="meta">Всё, в чём ошибся в практике этой коробки, возвращается сюда, пока не ответишь верно.</p>';

    else { h+=verdict(C.ok,/^¿?___/.test(item[0])?item[0].replace("___",cap(item[1])):item[0].replace("___",item[1])); }

function verdict(ok,sentence,extra){
  return '<div class="verdict '+(ok?'ok':'bad')+'"><span class="lab">'+(ok?'¡Muy bien!':'Así se dice')+'</span>'+(extra?esc(extra)+' ':'')+tap(sentence.charAt(0)==="_"?sentence:sentence)+'</div>';
}
function fillGap(P){const segs=G(P.text).split("___");let t="";segs.forEach((sg,k)=>{t+=tap(sg);if(k<segs.length-1){const v=P.items[k][1];const st=k===0||/[.?!]\s*$/.test(sg);t+='<span class="v">'+(st?cap(v):v)+'</span>';}});return t;}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function newItem(key,pi,i,b){
  const P=b.practice[pi],type=P.type||"tiles",item=P.items[i];
  C={key,pi,i,built:[],checked:false,ok:false,stage:0};
  if(type==="choice"||type==="gaptext"){C.opts=P.opts?P.opts.slice():shuffle(["soy","estoy"]);return;}
  if(type==="detect2"){C.opts=item[1]?shuffle([item[1],item[2]]):[];return;}
  if(type==="detect"){C.opts=shuffle(["soy","estoy"]);return;}
  const ans=tokens(item[1]);
  const lower=ans.map((w,k)=>(k===0&&w!=="Don")?w.toLowerCase():w);
  const extra=b.distract.filter(d=>!lower.map(x=>x.toLowerCase()).includes(d));
  C.ans=lower;C.tiles=shuffle(lower.concat(extra));
  if(Array.isArray(item[0])) C.chips=shuffle(item[0].slice());
}
function record(st,b){
  const errs=S.err[b.id]||(S.err[b.id]=[]);
  const at=errs.findIndex(x=>x[0]===C.pi&&x[1]===C.i);
  if(st.type==="p"){const r=resOf(st.key);if(!r.done.includes(C.i)){r.done.push(C.i);if(C.ok)r.ok.push(C.i);}
    if(!C.ok&&at<0)errs.push([C.pi,C.i]);}
  else { if(C.ok&&at>=0)errs.splice(at,1); else if(!C.ok&&at>=0){errs.push(errs.splice(at,1)[0]);} }
}

/* ===== События ===== */
document.addEventListener("click",e=>{
  const w=e.target.closest(".w");
  if(w){showPop(w.dataset.w,decodeURIComponent(w.dataset.ctx));return;}
  const el=e.target.closest("button,a,.overlay");
  if(!el) return;
  if(el.dataset.close){ if(el.classList.contains("overlay")&&e.target!==el) return; document.getElementById("layer").innerHTML="";return;}
  if(el.dataset.open){openLayer(el.dataset.open);return;}
  if(el.dataset.add){const d=DICT[el.dataset.add];S.dict.push({w:el.dataset.add,ru:d[0],lemma:d[1],ctx:decodeURIComponent(el.dataset.ctx)});save();document.getElementById("layer").innerHTML="";render();return;}
  if(el.dataset.learned!==undefined){S.dict.splice(+el.dataset.learned,1);save();openLayer("dict");render();return;}
  if(el.tagName==="A") return;
  const st=STEPS[S.step];
  if(el.dataset.g){S.g=el.dataset.g;C=null;}
  else if(el.dataset.step!==undefined){S.step=+el.dataset.step;C=null;window.scrollTo({top:0});}
  else if(el.dataset.tile!==undefined){const t=+el.dataset.tile;if(!C.built.includes(t))C.built.push(t);}
  else if(el.dataset.un!==undefined){if(!C.checked)C.built.splice(+el.dataset.un,1);}
  else if(el.dataset.pick){const b=boxOf(st);C.ok=el.dataset.pick===b.practice[C.pi].items[C.i][1];C.checked=true;record(st,b);}
  else if(el.dataset.det){const b=boxOf(st),it=b.practice[C.pi].items[C.i];
    if(el.dataset.det==="ok"){C.ok=it[1]===null;C.checked=true;record(st,b);}
    else{ if(it[1]===null){C.ok=false;C.checked=true;record(st,b);} else C.stage=1; } }

  else if(el.dataset.fix2!==undefined){const b=boxOf(st),it=b.practice[C.pi].items[C.i];C.ok=C.opts[+el.dataset.fix2]===it[1];C.checked=true;record(st,b);}
  else if(el.dataset.fix){const b=boxOf(st),it=b.practice[C.pi].items[C.i];C.ok=el.dataset.fix===it[1];C.checked=true;record(st,b);}
  else{
    const a=el.dataset.act;const b=boxOf(st);
    if(a==="introdone"){S.res["intro"]=1;S.step=1;C=null;}
    else if(a==="resultsdone"){S.res["results"]=1;}
    else if(a==="tq"){C.phase="q";C.qi=0;C.shown=false;}
    else if(a==="tshow"){C.shown=true; if(st.hb==="f"||C.qi===TALK[st.hb].qs.length-1) S.res["talk-"+st.hb]=1;}
    else if(a==="tnext"){if(C.qi<TALK[st.hb].qs.length-1)C.qi++;C.shown=false;}
    else if(a==="tread"){C.phase="read";C.shown=false;}
    else if(a==="chapterdone"){S.res["chapter"]=1;S.step=2;C=null;}
    else if(a==="theorydone"){S.res["t-"+st.box]=1;S.step=Math.min(S.step+1,STEPS.length-1);C=null;}
    else if(a==="clear"){C.built=[];}
    else if(a==="check"){
      const got=C.built.map(t=>C.tiles[t].toLowerCase()).join(" ");
      C.ok=got===C.ans.map(x=>x.toLowerCase()).join(" ");C.checked=true;record(st,b);
    }
    else if(a==="next"){C=null;}
    else if(a==="redo"){S.res[st.key]={done:[],ok:[]};C=null;}
    else if(a==="prev"){S.step=Math.max(S.step-1,0);C=null;window.scrollTo({top:0});}
    else if(a==="nextstep"){S.step=Math.min(S.step+1,STEPS.length-1);C=null;window.scrollTo({top:0});}
  }
  save();render();
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("w")){e.preventDefault();e.target.click();}});
render();
</script>
</body>
